  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      color: black;
      font-family: Georgia, serif;
      overflow-x: hidden;
      overflow-y: auto;
      user-select: none;

    body {

    #page {
      position: relative;
      width: calc(100vw - 60px);
      min-height: 100vh;
    }

    #drawCanvas,
    #lineCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      pointer-events: none;
    }

    #lineCanvas {
      z-index: 50;
    }

    #drawCanvas {
      z-index: 100;
    }

    .line {
      position: absolute;
      font-size: 22px;
      line-height: 30px;
      white-space: pre;
      z-index: 1;
      color: black;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .orb {
      position: absolute;
      width: 150px;
      height: auto;
      display: block;
      object-fit: contain;
      cursor: grab;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      background: transparent;
      mix-blend-mode: multiply;
    }

    .orb:active {
      cursor: grabbing;
    }

  <script type="module">
    import {
      prepareWithSegments,
      layoutNextLineRange,
      materializeLineRange
    } from 'https://cdn.jsdelivr.net/npm/@chenglou/pretext/+esm'

    const page = document.getElementById("page")
    const canvas = document.getElementById("drawCanvas")
    const ctx = canvas.getContext("2d")

    const lineCanvas = document.getElementById("lineCanvas")
    const lineCtx = lineCanvas.getContext("2d")

    const orbs = document.querySelectorAll(".orb")

    const text = `
Reimagining Asian Female Representation 
Introduction 
This paper examines the representation of Asian women in Western media through the framework of performance and scripting. It argues that dominant stereotypes such as the “lotus blossom,” “dragon lady,” “schoolgirl,” “exotic other,” and “Tiger Mom” function as pre-existing cultural scripts that shape how Asian women are perceived and how they are expected to perform identity. Drawing on feminist theory, performance studies, and media analysis This paper the paper argues that these structures are difficult to escape entirely, yet they are not fixed. Through critical awareness and artistic practice, such scripts can be disrupted, rewritten, and re-performed. At the same time, this paper demonstrates that reclaiming representation is an ongoing process, one that requires action, experimentation, and time. Ultimately, it positions performance as both a site of constraint and a strategy for resistance, where new forms of identity and agency can emerge. 
Stereotypes as Cultural Scripts 
The representation of Asian women in Western media has long been structured through a limited set of recurring images. As Aki Uchida argues, the “Oriental Woman” operates as a “controlling image” that objectifies Asian women as exotic, submissive, and sexually available. These representations are not isolated stereotypes, but part of a broader ideological system rooted in Orientalism, colonial history, and gendered power relations. They are produced and sustained through repetition, circulation, and normalization across visual culture. 
Similarly, Renée Tajima identifies two dominant archetypes in film: the passive “Lotus Blossom” and the aggressive “Dragon Lady,” both of which reduce Asian women to simplified and sexualized roles. While these figures appear oppositional, for example, innocent versus dangerous. They ultimately function within the same logic which is defining Asian women in relation to male desire and Western narrative frameworks. Tajima further argues that these representations collapse diverse Asian identities into a single interchangeable type, where characters lack specificity, individuality, and voice. Language itself becomes a tool of reduction, as Asian women are often limited to broken English, silence, or caricature, reinforcing their position as objects rather than subjects. 
 Asian women are frequently portrayed as passive figures defined through their relationships to men. They are appearing as love interests, background characters, or objects of desire and sacrifice, while rarely being granted agency or narrative autonomy. Tajima identifies a paradox of hypervisibility and invisibility: Asian women are highly visible as stereotypes, yet largely absent from representations of everyday life and complexity. Importantly, these images are not static but shaped by historical and political conditions, shifting in response to war, U.S and Asia relations, and immigration patterns.  
Celine Parreñas Shimizu expands this framework by analyzing the hyper sexualization of Asian American women across media forms. She highlights how figures such as the prostitute, dominatrix, or “easy Asian girl” produce a contradictory experience of pleasure and violence, where viewers are invited to both desire and dominate the Asian female body. This dynamic reveals how visual pleasure is entangled with power, reinforcing hierarchies even as it appears to offer agency or visibility. These representational patterns also extend into narratives of interracial relationships, which often privilege pairings between Asian women and white men while marginalizing or emasculating Asian men, thereby reinforcing racial and gender hierarchies. 
These images operate as scripts that not only shape perception but also inform expectations of behavior in everyday life. They circulate beyond the screen, influencing how Asian women are read in social, cultural, and interpersonal contexts from fetishization and assumptions of submissiveness to real-world structures such as the mail-order bride industry.  
Postmodern Media and the Persistence of Stereotypes 
In contemporary media, the logic of representation becomes even more complex under postmodern conditions. As Gina Marchetti argues, postmodern cinema often treats identity as spectacle, recycling historical stereotypes as stylistic elements rather than critically engaging with them. In this context, images of Asian women, whether traditional or seemingly subversive, circulate as interchangeable signs within a visual economy driven by consumption. Rather than functioning as meaningful representations, they become aesthetic surfaces to be looked at, consumed, and circulated. 
This postmodern flattening of meaning allows contradictory representations to coexist: the “dragon lady” and the “empowered action heroine,” the submissive lover and the hypersexual subject. While this plurality may appear liberatory, it often lacks critical depth, reducing identity to surface-level variation without addressing underlying power structures. In other words, difference becomes stylistic rather than political. As a result, representation no longer aims to reflect reality or challenge ideology but instead reproduces familiar visual codes under the guise of novelty. 
Marchetti’s analysis of films such as Chinatown and Year of the Dragon illustrates how race and identity are transformed into spectacle within postmodern cinema. These films construct “Chinatown” not as a lived, historical space but as a stylized fantasy composed of recognizable visual tropes neon lights, lion dances, martial arts, ritualized violence, and exoticized atmospheres. These elements are detached from their cultural and historical contexts and reassembled as aesthetic fragments. Older stereotypes, such as the “yellow peril,” persist alongside contemporary imagery, creating a layered but ultimately flattened representation in which historical meaning is obscured rather than interrogated. 
Within this framework, race and identity become unstable, fragmented, and increasingly emptied of grounded meaning. Characters are often contradictory and interchangeable, reflecting a postmodern condition in which identity appears fluid but lacks political substance. Interracial relationships exemplify this shift. While earlier films used such relationships to explore tensions of race, gender, and power, postmodern cinema often reduces them to visual contrast an aesthetic device that highlights difference without critically engaging it. In Year of the Dragon, for example, the pairing of a white male protagonist with an Asian woman reinforces familiar hierarchies, even as it is presented through the lens of modern, stylized storytelling. The Asian female character often becomes a site of negotiation where identity is compromised or relinquished, further reinforcing her position within existing power structures. Postmodernism, therefore, does not necessarily signal a break from earlier modes of representation but rather a transformation in how stereotypes operate shifting from overt ideological constructions to subtle, circulating signs within a global media economy. 
 
A Site of Negotiation  
If performance is a site where identity is constrained, it is also a site where resistance becomes possible. Rather than treating these representations solely as oppressive stereotypes to be rejected, Shimizu complicates the discussion by asking how such images might also function as sites of agency, ambivalence, and political intervention. Her work ultimately argues that hypersexuality operates as both a constraint and a potential resource a paradoxical condition through which identity is negotiated, contested, and reimagined. 
However, Shimizu resists a purely negative reading of hypersexuality. She introduces the concept of hypersexuality as a “bind”, a condition that is both restrictive and generative. On one hand, these representations are deeply harmful, reinforcing racialized objectification and limiting the ways Asian women can be understood. On the other hand, because these images are so pervasive, they become unavoidable points of engagement. Asian American women must confront, navigate, and interpret these representations in the process of forming their own identities. Identity, therefore, is not constructed outside of these images but through a continuous negotiation with them. 
Ultimately, Shimizu’s work reframes hypersexuality not simply as a problem to be eliminated but as a complex terrain of struggle and possibility. The hypersexualized representation of Asian American women is undeniably rooted in histories of racism, colonialism, and patriarchy. Yet, through critical engagement and performative reworking, these images can also become tools for reclaiming identity and asserting agency. In this sense, Shimizu offers a powerful rethinking of representation one that acknowledges its constraints while insisting on its potential for transformation.  
Performance as Resistance  
Performance becomes a way to actively confront and change how these identities are formed. To resist is to practice rewriting. Through repeating and performing these roles differently. By exaggerating, shifting, or interrupting these roles, the body moves from being controlled by representation to actively reshaping it. This process creates a “glitch “a moment where the performance does not match what is expected. These disruptions open new possibilities, allowing identity to move beyond fixed meanings.  
Conclusion 
The representation of Asian women in Western media is shaped by persistent stereotypes that function as cultural scripts, limiting how identity is seen and performed. Even in postmodern media, these images continue to circulate in new forms rather than disappear. However, these scripts are not fixed. As this paper argues, identity is formed through an ongoing negotiation with these representations. Performance becomes a key site of resistance. By repeating, distorting, and interrupting dominant roles, it exposes them as constructed rather than natural. Reimagining Asian female identity, then, is not about replacing stereotypes, but about continuously rewriting them. Through performance, identity becomes a process of change, allowing for more complex, shifting, and self-defined ways of being. 
Bibliography 
Marchetti, Gina. Romance and the “Yellow Peril”: Race, Sex, and Discursive Strategies in Hollywood Fiction. Berkeley: University of California Press, 1994.  
Shimizu, Celine Parreñas. The Hypersexuality of Race: Performing Asian/American Women on Screen and Scene. Durham: Duke University Press, 2007.  
Tajima, Renée E. “Lotus Blossoms Don’t Bleed: Images of Asian Women.” In Making Waves: An Anthology of Writings by and about Asian American Women. Boston: Beacon Press, 1989.  
Tajima, Renée. “Moving the Image: Asian American Independent Filmmaking 1970-1990.”  
Uchida, Aki. “The Orientalization of Asian Women in America.” Women’s Studies International Forum 21, no. 2 (1998): 161–174.  
Zhou, Yanyan, and Bryant Paul. “Lotus Blossom or Dragon Lady: A Content Analysis of ‘Asian Women’ Online Pornography.” Sexuality & Culture 20 (2016): 1083–1100
`

    const FONT = "22px Georgia"
    const LINE_HEIGHT = 30
    let PAGE_WIDTH = page.clientWidth
    const START_X = 20
    const START_Y = 20
    const PAD = 8

    const prepared = prepareWithSegments(text, FONT, {
      whiteSpace: "pre-wrap"
    })

    let drawnBlocks = []
    let lineBlocks = []

    function resizeCanvas() {
      PAGE_WIDTH = page.clientWidth
      const h = page.offsetHeight

      if (canvas.width !== PAGE_WIDTH || canvas.height !== h) {
        canvas.width = PAGE_WIDTH
        canvas.height = h
      }

      if (lineCanvas.width !== PAGE_WIDTH || lineCanvas.height !== h) {
        const oldLine = document.createElement("canvas")
        oldLine.width = lineCanvas.width
        oldLine.height = lineCanvas.height
        oldLine.getContext("2d").drawImage(lineCanvas, 0, 0)

        lineCanvas.width = PAGE_WIDTH
        lineCanvas.height = h
        lineCtx.drawImage(oldLine, 0, 0)
      }
    }

    function getBlockedRanges(y) {
      const ranges = []

      orbs.forEach(orb => {
        const left = orb.offsetLeft - PAD
        const top = orb.offsetTop - PAD
        const right = orb.offsetLeft + orb.offsetWidth + PAD
        const bottom = orb.offsetTop + orb.offsetHeight + PAD

        if (y >= top && y <= bottom) {
          ranges.push({ left, right })
        }
      })

      drawnBlocks.forEach(block => {
        if (y >= block.top && y <= block.bottom) {
          ranges.push(block)
        }
      })

      lineBlocks.forEach(block => {
        if (y >= block.top && y <= block.bottom) {
          ranges.push(block)
        }
      })

      ranges.sort((a, b) => a.left - b.left)
      return ranges
    }

    function getBestOpenRange(y) {
      const blocked = getBlockedRanges(y)
      let openRanges = []
      let currentX = START_X

      blocked.forEach(block => {
        if (block.left > currentX) {
          openRanges.push({
            x: currentX,
            width: block.left - currentX
          })
        }

        currentX = Math.max(currentX, block.right)
      })

      if (currentX < PAGE_WIDTH) {
        openRanges.push({
          x: currentX,
          width: PAGE_WIDTH - currentX
        })
      }

      openRanges = openRanges.filter(range => range.width > 80)
      if (openRanges.length === 0) return null

      openRanges.sort((a, b) => b.width - a.width)
      return openRanges[0]
    }

    function drawText() {
      resizeCanvas()
      page.querySelectorAll(".line").forEach(line => line.remove())

      let cursor = {
        segmentIndex: 0,
        graphemeIndex: 0
      }

      let y = START_Y

      while (true) {
        const openRange = getBestOpenRange(y)

        if (!openRange) {
          y += LINE_HEIGHT
          continue
        }

        const range = layoutNextLineRange(prepared, cursor, openRange.width)
        if (range === null) break

        const line = materializeLineRange(prepared, range)

        const div = document.createElement("div")
        div.className = "line"
        div.textContent = line.text
        div.style.left = openRange.x + "px"
        div.style.top = y + "px"

        page.appendChild(div)

        cursor = range.end
        y += LINE_HEIGHT
      }

      page.style.height = y + 300 + "px"
      resizeCanvas()
    }

    let drawing = false
    let particles = []
    let lastLinePoint = null

    let oneDown = false
    let twoDown = false
    let threeDown = false
    let gDown = false
    let rDown = false

    function getMouseOnPage(e) {
      const rect = page.getBoundingClientRect()
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      }
    }

    function getRandomColor() {
      const colors = [
        "#ff4d6d",
        "#ff99c8",
        "#cdb4db",
        "#a2d2ff",
        "#bde0fe",
        "#d8f3dc",
        "#fff3b0",
        "#ffc6ff",
        "#9bf6ff",
        "#caffbf"
      ]

      return colors[Math.floor(Math.random() * colors.length)]
    }

    document.addEventListener("keydown", e => {
      if (e.key === "1") oneDown = true
      if (e.key === "2") twoDown = true
      if (e.key === "3") threeDown = true
      if (e.key.toLowerCase() === "g") gDown = true
      if (e.key.toLowerCase() === "r") rDown = true
    })

    document.addEventListener("keyup", e => {
      if (e.key === "1") oneDown = false
      if (e.key === "2") twoDown = false
      if (e.key === "3") threeDown = false
      if (e.key.toLowerCase() === "g") gDown = false
      if (e.key.toLowerCase() === "r") rDown = false

      lastLinePoint = null
    })

    document.addEventListener("mousedown", e => {
      if (!oneDown && !(twoDown && gDown) && !(threeDown && rDown)) return

      e.preventDefault()
      drawing = true

      const pos = getMouseOnPage(e)

      if (oneDown) {
        createParticles(pos.x, pos.y)
      }

      if (twoDown && gDown) {
        lastLinePoint = pos
        drawLine(pos.x, pos.y, "#00cc66")
      }

      if (threeDown && rDown) {
        lastLinePoint = pos
        drawLine(pos.x, pos.y, "#ff2d55")
      }
    })

    document.addEventListener("mousemove", e => {
      if (!drawing) return

      e.preventDefault()

      const pos = getMouseOnPage(e)

      if (oneDown) {
        createParticles(pos.x, pos.y)
      }

      if (twoDown && gDown) {
        drawLine(pos.x, pos.y, "#00cc66")
      }

      if (threeDown && rDown) {
        drawLine(pos.x, pos.y, "#ff2d55")
      }
    })

    document.addEventListener("mouseup", () => {
      drawing = false
      lastLinePoint = null
    })

    function drawLine(x, y, color) {
      lineCtx.save()
      lineCtx.strokeStyle = color
      lineCtx.lineWidth = 5
      lineCtx.lineCap = "round"
      lineCtx.lineJoin = "round"

      if (lastLinePoint) {
        lineCtx.beginPath()
        lineCtx.moveTo(lastLinePoint.x, lastLinePoint.y)
        lineCtx.lineTo(x, y)
        lineCtx.stroke()

        lineBlocks.push({
          left: Math.min(lastLinePoint.x, x) - 14,
          right: Math.max(lastLinePoint.x, x) + 14,
          top: Math.min(lastLinePoint.y, y) - 14,
          bottom: Math.max(lastLinePoint.y, y) + 14
        })

        drawText()
      }

      lastLinePoint = { x, y }
      lineCtx.restore()
    }

    function createParticles(x, y) {
      for (let i = 0; i < 2; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 30,
          y: y + (Math.random() - 0.5) * 30,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          size: Math.random() * 13 + 4,
          life: 1,
          color: getRandomColor()
        })
      }
    }

    function updateParticles() {
      resizeCanvas()

      ctx.clearRect(0, 0, canvas.width, canvas.height)
      drawnBlocks = []

      particles.forEach(p => {
        p.x += p.vx
        p.y += p.vy

        p.vx += (Math.random() - 0.5) * 0.005
        p.vy += (Math.random() - 0.5) * 0.005

        p.vx *= 0.98
        p.vy *= 0.98

        p.y -= 0.03
        p.life -= 0.01

        ctx.save()
        ctx.beginPath()
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
        ctx.fillStyle = p.color
        ctx.globalAlpha = Math.max(p.life, 0)
        ctx.shadowBlur = 8
        ctx.shadowColor = p.color
        ctx.fill()
        ctx.restore()

        drawnBlocks.push({
          left: p.x - 20,
          right: p.x + 20,
          top: p.y - 20,
          bottom: p.y + 20
        })
      })

      particles = particles.filter(p => p.life > 0)

      requestAnimationFrame(updateParticles)
    }

    let t = 0
    let frameCount = 0
    let activeDragOrb = null
    let offsetX = 0
    let offsetY = 0

    orbs.forEach(orb => {
      orb.dataset.baseX = orb.offsetLeft
      orb.dataset.baseY = orb.offsetTop

      orb.addEventListener("mousedown", e => {
        if (oneDown || twoDown || threeDown || gDown || rDown) return

        e.preventDefault()

        activeDragOrb = orb
        offsetX = e.clientX - orb.offsetLeft
        offsetY = e.clientY + window.scrollY - orb.offsetTop
      })
    })

    document.addEventListener("mousemove", e => {
      if (!activeDragOrb) return

      e.preventDefault()

      activeDragOrb.style.left = e.clientX - offsetX + "px"
      activeDragOrb.style.top = e.clientY + window.scrollY - offsetY + "px"

      activeDragOrb.dataset.baseX = activeDragOrb.offsetLeft
      activeDragOrb.dataset.baseY = activeDragOrb.offsetTop

      if (frameCount % 4 === 0) {
        drawText()
      }
    })

    document.addEventListener("mouseup", () => {
      activeDragOrb = null
    })

    function autoFloat() {
      frameCount++

      orbs.forEach((orb, i) => {
        if (orb === activeDragOrb) return

        const baseX = Number(orb.dataset.baseX)
        const baseY = Number(orb.dataset.baseY)

        orb.style.left = baseX + Math.sin(t + i * 2) * 35 + "px"
        orb.style.top = baseY + Math.cos(t + i * 2) * 30 + "px"
      })

      if (frameCount % 10 === 0) {
        drawText()
      }

      t += 0.015
      requestAnimationFrame(autoFloat)
    }

    window.addEventListener("resize", () => {
      PAGE_WIDTH = page.clientWidth
      resizeCanvas()
      drawText()
    })

    drawText()
    updateParticles()
    autoFloat()
  </script>
