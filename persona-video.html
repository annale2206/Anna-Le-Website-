<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anna_le: crochet persona</title>
<link rel="stylesheet" href="style.css">
<style>
  [hidden]{ display:none !important; }
  html, body{ height:100%; }
  body{ overflow:hidden; }
  header.nav{ padding:12px 24px; }

  /* ================= the machine ================= */
  .lm{
    height:calc(100vh - 56px); padding:0 16px 14px;
    display:flex; justify-content:center; align-items:stretch; gap:12px;
  }
  .cabinet{
    position:relative; flex:0 1 1240px; min-width:0;
    display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto; gap:10px;
    padding:12px 16px 14px;
    background:linear-gradient(160deg, #ff7cc0 0%, #ff3d9a 35%, #8a5cf6 100%);
    border:5px solid #dfe6f2; border-radius:34px 34px 20px 20px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 10px 10px 0 rgba(0,0,0,.45);
  }

  /* marquee with chasing bulbs */
  .marquee{
    position:relative; text-align:center; padding:6px 10px;
    background:#2a1750; border-radius:16px; border:3px solid #ffd23f;
  }
  .marquee::before, .marquee::after{
    content:''; position:absolute; left:10px; right:10px; height:8px;
    background:radial-gradient(circle, #ffd23f 3px, transparent 3.6px) 0 50%/18px 8px repeat-x;
    animation:chase .5s steps(2) infinite;
  }
  .marquee::before{ top:2px; } .marquee::after{ bottom:2px; animation-direction:reverse; }
  @keyframes chase{ to{ background-position:18px 50%; } }
  .marquee h1{
    margin:0; font-family:var(--display); font-size:clamp(1rem, 2.2vw, 1.5rem); letter-spacing:.06em;
    color:#fff; text-shadow:0 0 8px #ff3d9a, 3px 3px 0 #ff3d9a;
  }

  /* glass window with the persona capsules */
  .window{
    position:relative; min-width:0; background:rgba(230,245,255,.18);
    border:3px solid rgba(255,255,255,.75); border-radius:16px;
    box-shadow: inset 0 0 30px rgba(255,255,255,.25);
    padding:6px 8px 4px;
  }
  .window::after{
    content:''; position:absolute; inset:5px auto 5px 12px; width:36px; border-radius:18px;
    background:linear-gradient(90deg, rgba(255,255,255,.35), transparent); pointer-events:none;
  }
  .reel{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 6px; scroll-behavior:smooth; }
  .reel::-webkit-scrollbar{ height:6px; }
  .reel::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.6); border-radius:3px; }
  .cap{
    flex:0 0 auto; position:relative; width:54px; height:78px; padding:0; cursor:pointer;
    border-radius:27px; border:3px solid #fff; background:#fff; overflow:hidden;
    box-shadow:0 3px 0 rgba(0,0,0,.25); transition:transform .12s ease;
  }
  .cap img{ width:100%; height:100%; object-fit:contain; }
  .cap::after{
    content:''; position:absolute; inset:0; border-radius:24px;
    background:linear-gradient(120deg, rgba(255,255,255,.65) 0 18%, transparent 30%),
               linear-gradient(transparent 48%, rgba(255,61,154,.18) 48% 52%, transparent 52%);
    pointer-events:none;
  }
  .cap:hover{ transform:translateY(-3px); }
  .cap.on{ border-color:#ffd23f; box-shadow:0 0 0 3px #ffd23f, 0 0 18px #ffd23f; transform:translateY(-3px); }
  .cap.flash{ border-color:#9dff9e; box-shadow:0 0 0 3px #9dff9e; }
  .cap.add{ display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.25); border-style:dashed; color:#fff; font-family:var(--display); font-size:1.4rem; }
  .cap.add::after{ display:none; }

  /* chosen persona (small) → video screen (big) */
  .stage{ display:grid; grid-template-columns:minmax(0,1fr) 34px minmax(0,3.2fr); gap:8px; min-height:0; }
  .display{
    position:relative; min-height:0; border-radius:16px; overflow:hidden;
    border:4px solid #dfe6f2; box-shadow:inset 0 0 0 3px #2a1750;
    display:flex; align-items:center; justify-content:center;
  }
  .display.chosen{ background:#fff; }
  .display.chosen img{ width:100%; height:100%; object-fit:contain; }
  .display.screen{ background:#05070a; }
  .display.screen video{ width:100%; height:100%; object-fit:contain; display:block; }
  .display .idle{ font-family:var(--mono); color:#7a8a99; font-size:1.25rem; text-align:center; padding:12px; }
  .display.screen .idle{ color:#5fae6a; font-size:1.5rem; }
  .display.screen.busy::before{
    content:''; position:absolute; left:0; right:0; height:40%; top:-40%;
    background:linear-gradient(transparent, rgba(157,255,158,.18), transparent); animation:scanv 1.6s linear infinite;
  }
  @keyframes scanv{ to{ top:100%; } }
  .arrow{ display:flex; align-items:center; justify-content:center; font-family:var(--display); color:#ffd23f; font-size:1.5rem; text-shadow:2px 2px 0 #2a1750; }

  /* control panel */
  .panel{
    background:#2a1750; border-radius:16px; border:3px solid #dfe6f2; padding:8px 10px;
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
  }
  .panel textarea{
    width:100%; height:48px; resize:none; background:#0d141b; color:var(--cream);
    border:2px solid #5fae6a; border-radius:10px; padding:6px 10px; font-family:var(--body); font-size:.95rem; outline:none;
  }
  .panel textarea:focus{ border-color:#9dff9e; }
  .knobs{ display:flex; flex-direction:column; gap:4px; }
  .knobs select{
    background:#0d141b; color:var(--cream); border:2px solid #7fd4ff; border-radius:8px;
    font-family:var(--mono); font-size:1rem; padding:1px 6px; outline:none;
  }
  .big{
    width:70px; height:70px; border-radius:50%; cursor:pointer; position:relative;
    border:4px solid #dfe6f2; background:radial-gradient(circle at 35% 30%, #ff9fd0, #ff3d9a 55%, #b5106a);
    box-shadow:0 5px 0 #7a0b48, 0 9px 12px rgba(0,0,0,.35);
    font-family:var(--display); color:#fff; font-size:.7rem; line-height:1.1; text-shadow:1px 1px 0 #7a0b48;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .big:active:not(:disabled){ transform:translateY(5px); box-shadow:0 1px 0 #7a0b48; }
  .big:disabled{ filter:grayscale(.6); opacity:.6; cursor:not-allowed; }
  .big.ext{ background:radial-gradient(circle at 35% 30%, #c9ffca, #43e0c9 55%, #138a78); box-shadow:0 5px 0 #0b5a4e, 0 9px 12px rgba(0,0,0,.35); text-shadow:1px 1px 0 #0b5a4e; }

  .tray{ grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tray:not(:has(.clip)):not(:has(.status:not(:empty))) { display:none; }
  .status{ font-family:var(--mono); font-size:1.1rem; color:#ffd23f; margin-right:auto; }
  .status.err{ color:#ff9fd0; }
  .clip, .tbtn{
    font-family:var(--mono); font-size:1rem; background:#0d141b; color:var(--cream);
    border:1.5px solid #5fae6a; border-radius:8px; padding:2px 9px; cursor:pointer; display:inline-flex; gap:6px; align-items:center;
  }
  .clip.on{ border-color:#ff3d9a; color:#ff9fd0; }
  .clip a{ color:#7fd4ff; text-decoration:none; }
  .tbtn:hover{ border-color:#9dff9e; }
  .tbtn:disabled{ opacity:.4; cursor:not-allowed; }

  /* side lever = lucky pick, in its own column so the label always shows */
  .lever-col{ flex:0 0 70px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .lever{ position:relative; width:56px; height:190px; cursor:pointer; background:none; border:0; padding:0; }
  .lever .base{ position:absolute; left:0; bottom:0; width:26px; height:70px; background:#dfe6f2; border-radius:0 12px 12px 0; box-shadow:4px 4px 0 rgba(0,0,0,.35); }
  .lever .arm{
    position:absolute; left:16px; bottom:40px; width:10px; height:140px; background:linear-gradient(90deg,#9aa6b8,#eef2f8,#9aa6b8);
    border-radius:5px; transform-origin:50% 100%; transition:transform .25s ease;
  }
  .lever .ball{
    position:absolute; left:-15px; top:-34px; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3a6, #ffd23f 55%, #c99a00); box-shadow:0 3px 0 #8a6a00;
  }
  .lever.pull .arm{ transform:scaleY(-.55); }
  .lever-label{ font-family:var(--mono); color:#ffd23f; font-size:1.1rem; text-align:center; line-height:1.1; }

  .spin-btn{ display:none !important; }

  /* ---------- small screens: let it scroll ---------- */
  @media (max-width:760px), (max-height:560px){
    body{ overflow:auto; }
    .lm{ height:auto; padding:0 12px 24px; }
    .cabinet{ grid-template-rows:auto; }
    .stage{ grid-template-columns:1fr; }
    .arrow{ transform:rotate(90deg); height:26px; }
    .display.chosen{ height:200px; }
    .display.screen{ aspect-ratio:16/9; }
    .panel{ grid-template-columns:1fr auto; }
    .panel textarea{ grid-column:1 / -1; }
    .lever-col{ display:none; }
    .spin-btn{ display:inline-flex !important; }
    .tray{ display:flex !important; }
  }

  /* access code */
  .gate{ position:fixed; inset:0; z-index:60; background:rgba(8,12,17,.78); display:flex; align-items:center; justify-content:center; padding:16px; }
  .gate-card{ background:#2a1750; border:4px solid #ffd23f; border-radius:20px; padding:22px; width:min(300px,100%); text-align:center; box-shadow:8px 8px 0 rgba(0,0,0,.4); }
  .gate-card p{ font-family:var(--display); color:#fff; font-size:1rem; margin:0 auto 12px; }
  .gate-card input{ font-family:var(--mono); font-size:2rem; letter-spacing:.5em; text-align:center; width:180px; padding:6px; background:#0d141b; color:#9dff9e; border:2px solid #5fae6a; border-radius:10px; outline:none; }
  .gate-card input.err{ border-color:#ff3d9a; animation:shake .35s; }
  @keyframes shake{ 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .gate-card .tbtn{ margin-top:12px; }
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="index.html">anna<span>_</span>le</a>
</header>

<main class="lm">
  <div class="cabinet">

    <div class="marquee"><h1>crochet persona</h1></div>

    <div class="window">
      <div class="reel" id="reel"></div>
    </div>

    <div class="stage">
      <div class="display chosen" id="chosen"><div class="idle">pick a persona</div></div>
      <div class="arrow">→</div>
      <div class="display screen" id="screen">
        <div class="idle" id="idle">your video</div>
        <video id="player" muted playsinline controls hidden></video>
      </div>
    </div>

    <div class="panel">
      <textarea id="prompt" placeholder="type a prompt: how does the persona move?"></textarea>
      <div class="knobs">
        <select id="duration" aria-label="length">
          <option value="4">4 s</option>
          <option value="6">6 s</option>
          <option value="8" selected>8 s</option>
        </select>
        <select id="aspect" aria-label="frame">
          <option value="16:9">wide</option>
          <option value="9:16">tall</option>
        </select>
      </div>
      <button class="big" id="go" disabled>GENE<br>RATE</button>

      <div class="tray">
        <span class="status" id="status"></span>
        <button class="tbtn spin-btn" id="spin2">lucky pick</button>
        <span id="clips"></span>
        <button class="tbtn" id="playall" hidden>play all</button>
        <button class="tbtn" id="restart" hidden>clear</button>
      </div>
    </div>

    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="lever-col">
    <button class="lever" id="lever" aria-label="lucky pick"><span class="base"></span><span class="arm"><span class="ball"></span></span></button>
    <div class="lever-label">lucky<br>pick</div>
  </div>
</main>

<!-- access code, only when generating -->
<div class="gate" id="gate" hidden>
  <div class="gate-card" role="dialog" aria-modal="true" aria-label="access code">
    <p>enter code</p>
    <input id="code" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="access code">
    <div><button class="tbtn" id="gate-cancel">cancel</button></div>
  </div>
</div>

<script src="main.js" defer></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  /* ================================================================
     THE COLLECTION: one line per persona. Replace to change the set.
     ================================================================ */
  const PERSONAS = Array.from({ length: 14 }, (_, i) => {
    const n = String(i + 1).padStart(2, '0');
    return { src: 'crochet-persona/persona-' + n + '.webp', name: 'persona ' + n };
  });

  const MAX_PARTS = 10;
  let token = '';
  let selected = null;      // { src, name }
  let clips = [];           // [{ url, seconds, prompt }]
  let current = -1;
  let busy = false, spinning = false;
  let lastPrompt = '';

  try { token = sessionStorage.getItem('pvm-token') || ''; } catch (e) {}

  /* ---------------- reel of capsules ---------------- */
  const reel = $('reel');
  const add = document.createElement('button');
  add.className = 'cap add'; add.type = 'button'; add.title = 'upload image'; add.textContent = '+';
  add.onclick = () => $('file').click();
  reel.appendChild(add);

  const caps = PERSONAS.map((p, i) => {
    const b = document.createElement('button');
    b.className = 'cap'; b.type = 'button'; b.title = p.name;
    b.innerHTML = '<img alt="" loading="lazy">';
    b.querySelector('img').src = p.src; b.querySelector('img').alt = p.name;
    b.onclick = () => { if (!spinning) choose(p.src, p.name, b); };
    reel.appendChild(b);
    return b;
  });

  function choose(src, name, capEl) {
    selected = { src, name };
    caps.forEach(c => c.classList.toggle('on', c === capEl));
    const box = $('chosen');
    box.innerHTML = '';
    const img = document.createElement('img'); img.src = src; img.alt = name;
    box.appendChild(img);
    $('go').disabled = busy || !selected;
  }

  $('file').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = () => choose(r.result, 'my image', null);
    r.readAsDataURL(f);
  });

  /* ---------------- lucky pick (lever) ---------------- */
  function luckyPick() {
    if (spinning || busy) return;
    spinning = true;
    $('lever').classList.add('pull');
    setTimeout(() => $('lever').classList.remove('pull'), 300);
    const target = Math.floor(Math.random() * caps.length);
    const steps = caps.length * 2 + target;
    let i = 0;
    const tick = () => {
      caps.forEach(c => c.classList.remove('flash', 'on'));
      const c = caps[i % caps.length];
      c.classList.add('flash');
      c.scrollIntoView({ block: 'nearest', inline: 'center' });
      if (i >= steps) {
        c.classList.remove('flash');
        spinning = false;
        choose(PERSONAS[target].src, PERSONAS[target].name, c);
        return;
      }
      i++;
      setTimeout(tick, 40 + Math.pow(Math.max(0, i - steps + 10), 2) * 6);
    };
    tick();
  }
  $('lever').onclick = luckyPick;
  $('spin2').onclick = luckyPick;

  /* ---------------- access code (only when generating) ---------------- */
  let gateResolve = null;
  function needToken() {
    if (token) return Promise.resolve(true);
    $('gate').hidden = false; $('code').value = '';
    setTimeout(() => $('code').focus(), 50);
    return new Promise(r => { gateResolve = r; });
  }
  function closeGate(ok) { $('gate').hidden = true; if (gateResolve) { gateResolve(ok); gateResolve = null; } }
  $('gate-cancel').onclick = () => closeGate(false);
  $('gate').addEventListener('click', e => { if (e.target.id === 'gate') closeGate(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('gate').hidden) closeGate(false); });
  $('code').addEventListener('input', async e => {
    const code = e.target.value.replace(/\D/g, '').slice(0, 4);
    e.target.value = code;
    if (code.length < 4) return;
    try {
      const res = await fetch('/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const d = res.ok ? await res.json() : {};
      if (d.token) { token = d.token; try { sessionStorage.setItem('pvm-token', token); } catch (err) {} closeGate(true); return; }
    } catch (err) {}
    e.target.classList.add('err');
    setTimeout(() => { e.target.classList.remove('err'); e.target.value = ''; }, 450);
  });
  function forgetToken() { token = ''; try { sessionStorage.removeItem('pvm-token'); } catch (e) {} }
  const auth = extra => ({ ...(extra || {}), 'x-im-token': token });

  // API wants JPEG/PNG (not webp) and a small file → redraw as JPEG
  function toJpeg(src, maxSide = 1280) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = () => reject(new Error('could not read that image'));
      img.src = src;
    });
  }

  /* ---------------- generate ---------------- */
  function setStatus(msg, isErr) { $('status').textContent = msg || ''; $('status').classList.toggle('err', !!isErr); }
  function setBusy(on) {
    busy = on;
    $('screen').classList.toggle('busy', on);
    updateButton();
    $('playall').disabled = on; $('restart').disabled = on;
  }
  // the big button generates first, then becomes "extend"
  function updateButton() {
    const b = $('go');
    const ext = clips.length > 0;
    b.classList.toggle('ext', ext);
    b.innerHTML = ext ? 'EXT<br>END' : 'GENE<br>RATE';
    b.disabled = busy || (!ext && !selected) || clips.length >= MAX_PARTS;
    $('prompt').placeholder = ext ? 'what happens next? (empty = same motion)' : 'type a prompt: how does the persona move?';
  }

  async function startJob(image, prompt, part) {
    const res = await fetch('/api/generate-video', {
      method: 'POST', headers: auth({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ image, prompt, part, duration: Number($('duration').value), aspect: $('aspect').value })
    });
    if (res.status === 401) { forgetToken(); throw new Error('code expired, try again'); }
    if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 160));
    const d = await res.json();
    if (!d.id) throw new Error(d.error || 'no job id');
    return d.id;
  }
  async function waitFor(id) {
    const t0 = Date.now();
    while (Date.now() - t0 < 10 * 60 * 1000) {
      await new Promise(r => setTimeout(r, 3000));
      setStatus('generating... ' + Math.round((Date.now() - t0) / 1000) + 's');
      let res;
      try { res = await fetch('/api/prediction?id=' + encodeURIComponent(id), { cache: 'no-store', headers: auth() }); }
      catch (e) { continue; }
      if (res.status === 401) { forgetToken(); throw new Error('code expired, try again'); }
      if (!res.ok) throw new Error(res.status + ' while checking');
      const p = await res.json();
      if (p.status === 'succeeded' && p.output) return p.output;
      if (p.status === 'failed' || p.status === 'canceled') throw new Error(p.status + (p.error ? ': ' + String(p.error).slice(0, 160) : ''));
    }
    throw new Error('timed out');
  }
  async function makeClip(image, prompt) {
    setBusy(true); setStatus('generating...');
    try {
      const id = await startJob(image, prompt, clips.length);
      const url = await waitFor(id);
      clips.push({ url, prompt, seconds: Number($('duration').value) });
      play(clips.length - 1);
      setStatus('done');
      $('prompt').value = '';
    } catch (err) { setStatus(err.message, true); }
    finally { setBusy(false); renderClips(); }
  }

  // grab the last frame of the newest clip to start the next one from
  function lastFrameOf(url) {
    return new Promise(resolve => {
      const v = document.createElement('video');
      v.crossOrigin = 'anonymous'; v.muted = true; v.preload = 'auto'; v.src = url;
      const timer = setTimeout(() => resolve(null), 20000);
      v.addEventListener('error', () => { clearTimeout(timer); resolve(null); });
      v.addEventListener('loadedmetadata', () => { v.currentTime = Math.max(0, v.duration - 0.05); });
      v.addEventListener('seeked', () => {
        clearTimeout(timer);
        try {
          const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
          c.getContext('2d').drawImage(v, 0, 0); resolve(c.toDataURL('image/jpeg', 0.9));
        } catch (e) { resolve(null); }
      }, { once: true });
    });
  }

  $('go').addEventListener('click', async () => {
    if (busy) return;
    if (!(await needToken())) return;
    if (!clips.length) {
      if (!selected) return;
      lastPrompt = $('prompt').value.trim();
      try { await makeClip(await toJpeg(selected.src), lastPrompt); }
      catch (err) { setStatus(err.message, true); }
    } else {
      setStatus('reading last frame...');
      const frame = await lastFrameOf(clips[clips.length - 1].url);
      if (!frame) { setStatus('could not read the last frame', true); return; }
      const next = $('prompt').value.trim();
      if (next) lastPrompt = next;
      await makeClip(frame, lastPrompt);
    }
  });

  /* ---------------- playback ---------------- */
  const player = $('player');
  let playingAll = false;
  function play(i) {
    current = i; $('idle').hidden = true; player.hidden = false;
    player.src = clips[i].url; player.play().catch(() => {});
    renderClips();
  }
  player.addEventListener('ended', () => {
    if (playingAll && current < clips.length - 1) play(current + 1); else playingAll = false;
  });
  $('playall').onclick = () => { if (clips.length) { playingAll = true; play(0); } };
  $('restart').onclick = () => {
    if (busy || !confirm('clear this video?')) return;
    clips = []; current = -1;
    player.removeAttribute('src'); player.hidden = true; $('idle').hidden = false;
    setStatus(''); renderClips(); updateButton();
  };

  function renderClips() {
    const box = $('clips'); box.innerHTML = '';
    clips.forEach((c, i) => {
      const el = document.createElement('span');
      el.className = 'clip' + (i === current ? ' on' : '');
      el.title = c.prompt || '';
      el.innerHTML = '<span>' + (i + 1) + '</span><a download target="_blank" rel="noopener" title="download">↓</a>';
      el.querySelector('a').href = c.url;
      el.querySelector('a').onclick = e => e.stopPropagation();
      el.onclick = () => { playingAll = false; play(i); };
      box.appendChild(el);
    });
    $('playall').hidden = clips.length < 2;
    $('restart').hidden = clips.length === 0;
    updateButton();
  }
  updateButton();
})();
</script>
</body>
</html>
