<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>anna_le — persona</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero-sub{
    font-family:var(--mono); color:var(--sky); font-size:1.15rem;
    margin:-4px 0 24px;
  }
  .statement{ max-width:72ch; font-size:1.1rem; }

  .status{
    display:inline-block;
    margin:14px 0 30px;
    padding:10px 16px;
    border:2px dashed var(--green-dim);
    font-family:var(--mono);
    color:var(--green-dim);
    font-size:1rem;
    letter-spacing:.03em;
  }

  .mini-stage{
    position:relative;
    width:100vw;
    max-width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    margin-top:20px;
  }
  .mini-stage svg{ width:100%; height:auto; display:block; overflow:visible; padding:0 40px; box-sizing:border-box; }

  .mtrunk{ stroke:var(--bark); stroke-width:14; stroke-linecap:round; fill:none; }
  .mbranch{
    fill:none; stroke:var(--bark); stroke-width:3.5; stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:mgrow 1s ease forwards;
  }
  @keyframes mgrow{ to{ stroke-dashoffset:0; } }

  .mleaf{ opacity:0; animation:mleafin .5s ease forwards; transform-origin:center; }
  @keyframes mleafin{ from{opacity:0; transform:scale(.3);} to{opacity:.9; transform:scale(1);} }

  .mflower{
    cursor:pointer; opacity:0;
    animation:mbloom .5s cubic-bezier(.2,1.6,.4,1) forwards, msway 6s ease-in-out infinite 1s;
    transform-origin:center;
  }
  @keyframes mbloom{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(1);} }
  @keyframes msway{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  .mflower:hover{ filter:brightness(1.3); }

  .mlabel{
    font-family:var(--mono); font-size:14px; letter-spacing:.02em;
    opacity:0; animation:mfadein .5s ease forwards;
  }
  @keyframes mfadein{ to{opacity:1;} }

  .mblade{
    transform-origin:0px 0px;
    opacity:0;
    animation:mbladein .5s ease forwards;
  }
  @keyframes mbladein{
    from{ opacity:0; transform:scaleY(.15); }
    to{ opacity:.95; transform:scaleY(1); }
  }

  .tree-bird{ cursor:pointer; outline:none; }
  .tree-bird:focus-visible .bird-head-group{ filter:brightness(1.25); }
  .tree-bird.playing .bird-head-group{
    animation:tbird-bob .6s ease-in-out infinite;
    transform-origin:0px -55px;
  }
  @keyframes tbird-bob{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-6deg); }
  }

  .tnote{
    font-family:var(--mono);
    font-size:20px;
    opacity:0;
    pointer-events:none;
  }
  .tree-bird.playing .tnote{
    animation:tnote-float 2.2s ease-in infinite;
  }
  .tnote.tn1{ fill:var(--green); animation-delay:0s !important; }
  .tnote.tn2{ fill:var(--pink); animation-delay:.7s !important; }
  .tnote.tn3{ fill:var(--yellow); animation-delay:1.4s !important; }
  @keyframes tnote-float{
    0%{ opacity:0; transform:translateY(0) scale(.7); }
    20%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-20px) scale(1.1); }
  }
</style>
</head>
<body data-petals="6">

<header class="nav">
  <a class="logo" href="index.html">anna<span>_</span>le</a>
</header>

<main class="page">

  <div class="eyebrow">
    <h1>persona</h1>
    <span class="path">~/anna/research/persona</span>
  </div>
  <div class="hero-sub">research: algorithmic persona</div>
  <div class="status">// ongoing</div>

  <p class="statement">
  
  </p>

  <div class="mini-stage">
    <svg viewBox="0 0 1000 550">
      <defs>
        <symbol id="mflower-sym" viewBox="-22 -22 44 44">
          <path d="M0,-11 Q2,-17 7,-16" stroke="#6b4a23" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <ellipse cx="8" cy="-15" rx="5.5" ry="3.2" fill="#5fae6a" transform="rotate(-25 8 -15)"/>
          <path d="M0,-9 C9,-14 15,-4 13,7 C11,17 5,20 0,18 C-5,20 -11,17 -13,7 C-15,-4 -9,-14 0,-9 Z" fill="currentColor"/>
          <ellipse cx="-4" cy="-2" rx="3" ry="5" fill="#ffffff" opacity=".25" transform="rotate(-20 -4 -2)"/>
        </symbol>
      </defs>

      <!-- ground -->
      <ellipse cx="500" cy="530" rx="140" ry="14" fill="#232f28"/>

      <path class="mbranch" d="M500,380 Q403.4,354.1 297.2,325.6" pathLength="1" style="animation-delay:.05s"/>
      <path class="mbranch" d="M500,380 Q423.4,315.7 339.1,245.0" pathLength="1" style="animation-delay:.15s"/>
      <path class="mbranch" d="M500,380 Q457.7,289.4 411.3,189.7" pathLength="1" style="animation-delay:.25s"/>
      <path class="mbranch" d="M500,380 Q500,280 500,170"        pathLength="1" style="animation-delay:.35s"/>
      <path class="mbranch" d="M500,380 Q542.3,289.4 588.7,189.7" pathLength="1" style="animation-delay:.45s"/>
      <path class="mbranch" d="M500,380 Q576.6,315.7 660.9,245.0" pathLength="1" style="animation-delay:.55s"/>
      <path class="mbranch" d="M500,380 Q596.6,354.1 702.8,325.6" pathLength="1" style="animation-delay:.65s"/>

      <!-- a few decorative leaves along the branches -->
      <g transform="translate(390,300) rotate(-30) scale(1.1)"><g class="mleaf" style="animation-delay:.9s">
        <path d="M0,-12 C5,-7 5,6 0,13 C-5,6 -5,-7 0,-12 Z" fill="var(--green-dim)"/>
      </g></g>
      <g transform="translate(450,240) rotate(-15) scale(1)"><g class="mleaf" style="animation-delay:.95s">
        <path d="M0,-12 C5,-7 5,6 0,13 C-5,6 -5,-7 0,-12 Z" fill="#7bc98a"/>
      </g></g>
      <g transform="translate(500,250) rotate(0) scale(1.15)"><g class="mleaf" style="animation-delay:1s">
        <path d="M0,-12 C5,-7 5,6 0,13 C-5,6 -5,-7 0,-12 Z" fill="var(--green)"/>
      </g></g>

      <use class="mflower" href="#mflower-sym" x="317" y="223" width="48" height="48"

      <use class="mflower" href="#mflower-sym" x="389" y="168" width="48" height="48"

      <use class="mflower" href="#mflower-sym" x="472" y="144" width="60" height="60"

      <use class="mflower" href="#mflower-sym" x="567" y="168" width="48" height="48"

      <use class="mflower" href="#mflower-sym" x="639" y="223" width="48" height="48"

      <use class="mflower" href="#mflower-sym" x="681" y="303" width="48" height="48"

      <!-- labels -->
      <text class="mlabel" x="240" y="345" fill="var(--pink)" text-anchor="middle" transform="rotate(-16 240 345)" style="animation-delay:2s">persona studies</text>
      <text class="mlabel" x="285" y="270" fill="var(--orange)" text-anchor="middle" transform="rotate(-12 285 270)" style="animation-delay:2.05s">media studies</text>
      <text class="mlabel" x="365" y="200" fill="var(--sky)" text-anchor="middle" transform="rotate(-6 365 200)" style="animation-delay:2.1s">performance studies</text>
      <text class="mlabel" x="502" y="116" fill="var(--teal)" text-anchor="middle" style="font-size:15px; animation-delay:2.15s">critical algorithm studies</text>
      <text class="mlabel" x="635" y="200" fill="var(--purple)" text-anchor="middle" transform="rotate(6 635 200)" style="animation-delay:2.2s">philosophy of technology</text>
      <text class="mlabel" x="715" y="270" fill="var(--yellow)" text-anchor="middle" transform="rotate(12 715 270)" style="animation-delay:2.25s">hci</text>
      <text class="mlabel" x="760" y="345" fill="var(--green)" text-anchor="middle" transform="rotate(16 760 345)" style="animation-delay:2.3s">art and technology</text>

      <!-- persona figure, seated on the grass beneath the trunk -->
      <image href="persona.png" x="560" y="380" width="170" height="150" preserveAspectRatio="xMidYMax meet"/>

      <!-- bird, on the grass beside persona.png — click to toggle music -->
      <g id="tree-bird" class="tree-bird" transform="translate(470,530)" role="button" tabindex="0" aria-label="toggle music">
        <g class="bird-head-group">
          <image href="bird.png" x="-55" y="-110" width="110" height="110" preserveAspectRatio="xMidYMax meet"/>
        </g>
        <text class="tnote tn1" x="55" y="-75">♪</text>
        <text class="tnote tn2" x="22" y="-95">♫</text>

      </g>
    </svg>
  </div>

  <audio id="mbg-music" src="music1.mp3" loop></audio>

</main>

<footer class="site-footer">© anna_le </footer>

<script src="main.js" defer></script>
<script>
  document.querySelectorAll('.mflower').forEach(node=>{
    node.addEventListener('click', ()=>{
      const href = node.dataset.href;
      if(href) window.location.href = href;
    });
  });

  // grass blades along the ground, same technique as the homepage tree
  (function initMiniGrass(){
    const svgNS = 'http://www.w3.org/2000/svg';
    const grassLayer = document.getElementById('mgrassLayer');
    if(!grassLayer) return;
    const bladeColors = ['#5fae6a','#7bc98a','#3f7a52','#8fd99c'];
    const bladeCount = 70;
    for(let i=0;i<bladeCount;i++){
      const x = 365 + Math.random()*270;
      const y = 528 + Math.sin(x/40) * 4 + (Math.random()*6 - 3);
      const h = 12 + Math.random()*18;
      const rot = -18 + Math.random()*36;
      const bow = 1.5 + Math.random()*3;
      const color = bladeColors[Math.floor(Math.random()*bladeColors.length)];
      const delay = Math.random()*1.2;

      const g = document.createElementNS(svgNS,'g');
      g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);

      const path = document.createElementNS(svgNS,'path');
      const d = `M0,0 C${-bow},${-h*0.4} ${-bow*0.6},${-h*0.75} 0,${-h} `
               + `C${bow*0.6},${-h*0.75} ${bow},${-h*0.4} 0,0 Z`;
      path.setAttribute('d', d);
      path.setAttribute('class','mblade');
      path.setAttribute('fill', color);
      path.style.animationDelay = delay.toFixed(2)+'s';

      g.appendChild(path);
      grassLayer.appendChild(g);
    }
  })();

  // bird on the grass — click to toggle music1.mp3
  (function initTreeBird(){
    const bird = document.getElementById('tree-bird');
    const music = document.getElementById('mbg-music');
    if(!bird || !music) return;
    let playing = false;

    function setPlaying(v){
      playing = v;
      bird.classList.toggle('playing', v);
    }

    bird.addEventListener('click', ()=>{
      if(playing){
        music.pause();
        setPlaying(false);
      } else {
        music.play().then(()=> setPlaying(true)).catch(()=>{});
      }
    });

    bird.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        bird.dispatchEvent(new Event('click'));
      }
    });
  })();
</script>
</body>
</html>
