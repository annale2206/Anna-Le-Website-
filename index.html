<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anna_le — blossom nav tree</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg:#131b24;
    --bg-dot:#1c2733;
    --green:#9dff9e;
    --green-dim:#5fae6a;
    --pink:#ff3d9a;
    --purple:#8a5cf6;
    --purple-deep:#2a1750;
    --orange:#ff9f4d;
    --sky:#7fd4ff;
    --yellow:#ffd23f;
    --teal:#43e0c9;
    --bark:#6b4a8a;
    --cream:#eef4ee;
    --mono:'VT323', monospace;
    --display:'Bungee', system-ui;
    --body:'Space Grotesk', system-ui;

    /* seasonal slots — swapped by JS every hour, spring shown as default */
    --leaf-1:#5fae6a;
    --leaf-2:#7bc98a;
    --leaf-3:#9dff9e;
    --field-1:#1e3324;
    --field-2:#274430;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background-color:var(--bg);
    background-image:radial-gradient(var(--bg-dot) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--cream); font-family:var(--body);
    display:flex; flex-direction:column; align-items:center;
    padding:130px 20px 80px;
    position:relative;
    overflow:hidden;
  }
  h1{
    font-family:var(--display); font-size:1.3rem; color:var(--green);
    letter-spacing:.03em; margin:0 0 26px; z-index:2;
  }

  .season-clock{
    font-family:var(--mono); font-size:1.05rem; color:var(--green-dim);
    letter-spacing:.03em; margin:0 0 14px; z-index:2;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .season-clock .season-name{ color:var(--green); text-transform:capitalize; }

  .season-dial{ width:90px; height:90px; }
  .season-dial .wedge{ opacity:.55; transition:opacity .3s ease; }
  .season-dial .wedge.active{ opacity:1; }
  .season-dial .hand{
    stroke:var(--cream); stroke-width:2.5; stroke-linecap:round;
    transform-origin:45px 45px;
  }
  .season-dial .hub{ fill:var(--cream); }
  .season-dial .rim{ fill:none; stroke:var(--bg); stroke-width:2; }

  .stage{ position:relative; width:100%; max-width:1180px; z-index:2; }
  svg{ width:100%; height:auto; display:block; overflow:visible; }

  .branch{
    fill:none; stroke:var(--bark); stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:grow 1.4s ease forwards;
  }
  .b1{ stroke-width:9; }
  .b2{ stroke-width:6; animation-delay:.55s; }
  .b3{ stroke-width:3; animation-delay:1.5s; }
  .b2-tip{ stroke:#8a6bb0; }
  @keyframes grow{ to{ stroke-dashoffset:0; } }

  .trunk-fill{
    fill:url(#barkgrad); opacity:0;
    animation:trunkin .9s ease forwards;
  }
  @keyframes trunkin{ to{ opacity:1; } }
  .grain{
    fill:none; stroke:#3a2650; stroke-width:2; opacity:0;
    animation:grainin .8s ease forwards; animation-delay:.5s;
  }
  @keyframes grainin{ to{ opacity:.4; } }
  .ground{
    opacity:0; animation:grainin .8s ease forwards; animation-delay:.2s;
  }
  .grass{
    fill:none; stroke:var(--green-dim); stroke-width:2.5; stroke-linecap:round;
    opacity:0; animation:grainin .6s ease forwards; animation-delay:.4s;
  }
  .blade{
    transform-origin:0px 0px;
    opacity:0;
    animation:bladein .55s ease forwards;
  }
  @keyframes bladein{
    from{ opacity:0; transform:scaleY(.15); }
    to{ opacity:.95; transform:scaleY(1); }
  }

  .leaf{
    opacity:0;
    animation:leafin .5s ease forwards;
    transform-origin:center;
  }
  .leaf path{ fill:var(--green-dim); }
  .leaf line{ stroke:rgba(0,0,0,.3); stroke-width:1; }
  @keyframes leafin{ from{opacity:0; transform:scale(.3);} to{opacity:.9; transform:scale(1);} }

  .label{
    font-family:var(--mono); font-size:20px; letter-spacing:.05em;
    opacity:0; animation:fadein .6s ease forwards;
  }
  @keyframes fadein{ to{ opacity:1; } }

  .flower{
    cursor:pointer; opacity:0;
    animation:bloom .6s cubic-bezier(.2,1.6,.4,1) forwards, sway 6s ease-in-out infinite 1s;
    transform-origin:center;
  }
  @keyframes bloom{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(1);} }
  @keyframes sway{
    0%,100%{ transform:rotate(-2.5deg); }
    50%{ transform:rotate(2.5deg); }
  }
  .flower:hover{ filter:brightness(1.3); }
  .petal{ transition:transform .15s ease; }
  .flower:hover .petal{ transform:scale(1.12); }

  .pollen{
    pointer-events:none;
    animation:pollen-rise linear infinite;
  }
  @keyframes pollen-rise{
    0%{ opacity:0; transform:translate(0,0); }
    12%{ opacity:.85; }
    88%{ opacity:0; }
    100%{ transform:translate(var(--drift-x,6px), -60px); opacity:0; }
  }

  .petal-fall{
    position:absolute; top:-20px; font-size:14px;
    animation:fall linear infinite;
    z-index:1; opacity:.8;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(760px) rotate(360deg); }
  }

  /* ---- music bird: perched on a real branch, part of the tree scene ---- */
  .tree-bird{ cursor:pointer; outline:none; }
  .tree-bird:focus-visible .bird-head-group{ filter:brightness(1.25); }

  .tree-bird.playing .bird-head-group{
    animation:bird-bob .6s ease-in-out infinite;
    transform-origin:0px -47px;
  }
  @keyframes bird-bob{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-6deg); }
  }

  .tree-bird .note{
    font-family:var(--mono);
    font-size:20px;
    opacity:0;
    pointer-events:none;
  }
  .tree-bird.playing .note{
    animation:tree-note-float 2.2s ease-in infinite;
  }
  .tree-bird .n1{ fill:var(--green); animation-delay:0s !important; }
  .tree-bird .n2{ fill:var(--pink); animation-delay:.7s !important; }
  .tree-bird .n3{ fill:var(--yellow); animation-delay:1.4s !important; }
  @keyframes tree-note-float{
    0%{ opacity:0; transform:translateY(0) scale(.7); }
    20%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-20px) scale(1.1); }
  }

  /* ---- mobile only: desktop is untouched above 700px.
     Just center the tree in the viewport instead of it sitting at top. ---- */
  @media (max-width:700px){
    body{ justify-content:center; min-height:100vh; }
  }

  /* ---- season-specific behavior, driven by a class on <body> ---- */

  /* summer: the sun actually rises into place, leaves/grass turn more vividly green */
  #sun-glow{
    position:fixed; inset:0;
    background:radial-gradient(circle at 50% 25%, rgba(255,214,120,.35) 0%, transparent 55%);
    opacity:0; transition:opacity 1.5s ease;
    pointer-events:none; z-index:1;
  }
  body.season-summer #sun-glow{ opacity:1; }

  .sun-disc{
    position:fixed; left:50%; top:18%;
    width:70px; height:70px; margin-left:-35px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff2b8, #ffd670 55%, #ff9f4d 100%);
    box-shadow:0 0 60px 20px rgba(255,190,90,.45);
    opacity:0;
    transform:translateY(160px);
    pointer-events:none; z-index:1;
  }
  body.season-summer .sun-disc{
    animation: sunrise 3s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes sunrise{
    0%{ opacity:0; transform:translateY(160px); }
    40%{ opacity:1; }
    100%{ opacity:1; transform:translateY(0); }
  }

  body.season-summer .leaf{ filter:brightness(1.2) saturate(1.35); }
  body.season-summer .blade{ filter:brightness(1.15) saturate(1.3); }

  /* fall: everything simply turns yellow — no extra motion */
  body.season-fall .flower{
    filter: sepia(1) saturate(3.2) brightness(1.05);
  }

  /* spring: extra little flowers bloom on the ground */
  .ground-bloom{
    opacity:0;
    transform-origin:center;
  }
  body.season-spring .ground-bloom{
    animation: bloom .6s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  body.season-winter .flower{
    color:#f4faff !important;
  }
  /* the actual "frozen" pause only applies once .freeze-ready is added
     (well after every entrance animation has had time to finish) —
     never paired with .season-winter alone, so a flower/leaf can
     never get paused before it's had a chance to become visible */
  body.season-winter.freeze-ready .flower{
    animation-play-state:paused;
  }
  body.season-winter.freeze-ready .leaf{
    animation-play-state:paused;
  }
  body.season-winter .pollen{ display:none; }
</style>
</head>

<div class="season-clock" id="season-clock">
  <svg class="season-dial" viewBox="0 0 90 90">
    <path class="wedge" id="wedge-spring" d="M45,45 L45,7 A38,38 0 0,1 83,45 Z" fill="#7bc98a"/>
    <path class="wedge" id="wedge-summer" d="M45,45 L83,45 A38,38 0 0,1 45,83 Z" fill="#2fbf5f"/>
    <path class="wedge" id="wedge-fall"   d="M45,45 L45,83 A38,38 0 0,1 7,45 Z" fill="#d9a441"/>
    <path class="wedge" id="wedge-winter" d="M45,45 L7,45 A38,38 0 0,1 45,7 Z" fill="#cfeeff"/>
    <circle class="rim" cx="45" cy="45" r="38"/>
    <line class="hand" id="season-hand" x1="45" y1="45" x2="45" y2="12"/>
    <circle class="hub" cx="45" cy="45" r="4"/>
  </svg>
  <div id="season-text"></div>

<h1 style="margin-top:20px;">anna<span style="color:var(--pink)">_</span>le</h1>

<!-- background music -->
<audio id="bg-music" loop></audio>

<script>
  document.querySelectorAll('.flower').forEach(node=>{
    node.addEventListener('click', ()=>{
      const href = node.dataset.href;
      if(href) window.location.href = href;
    });
  });

  const svgNS = 'http://www.w3.org/2000/svg';
  const grassLayer = document.getElementById('grassLayer');
  const body = document.body;

  // ---- seasons: the tree cycles spring → summer → fall → winter,
  // advancing every real hour (hour % 4). Only the "nature" layer
  // changes — leaves, grass, ground, and the falling ambient
  // particles. Branches, trunk, and flower/nav colors stay put. ----
  const SEASONS = [
    { name:'spring',
      leaf1:'#5fae6a', leaf2:'#7bc98a', leaf3:'#9dff9e',
      field1:'#1e3324', field2:'#274430',
      grass:['#5fae6a','#7bc98a','#3f7a52','#8fd99c'],
      glyph:'❁', particles:['#ff3d9a','#ff9f4d','#7fd4ff','#ffd23f','#9dff9e','#8a5cf6'],
      particleCount:14, track:'spring.mp3'
    },
    { name:'summer',
      leaf1:'#3f8f4f', leaf2:'#5fae6a', leaf3:'#2fbf5f',
      field1:'#16281c', field2:'#1d3a26',
      grass:['#2f7a3f','#3f8f4f','#276b36','#4fae5f'],
      glyph:'❁', particles:['#ff3d9a','#ffd23f','#7fd4ff','#ff9f4d','#9dff9e','#43e0c9'],
      particleCount:14, track:'summer.mp3'
    },
    { name:'fall',
      leaf1:'#f2d356', leaf2:'#e0433f', leaf3:'#e8973f',
      field1:'#3a2f1e', field2:'#4a3a22',
      grass:['#a68a3f','#8a6b2f','#6b7a3f','#c9a441'],
      glyph:'❁', particles:['#f2d356','#e0433f','#e8973f','#ffe07a','#c9433f'],
      particleCount:20, track:'fall.mp3'
    },
    { name:'winter',
      leaf1:'#d7e7ea', leaf2:'#eaf3f5', leaf3:'#c3d9de',
      field1:'#1a232a', field2:'#232f38',
      grass:['#8aa3a8','#a8bfc4','#6f8a90','#b8ced2'],
      glyph:'❄', particles:['#ffffff','#cfeeff','#e8f6ff','#b8dfff'],
      particleCount:40, track:'winter.mp3'
    }
  ];

  function currentSeasonIndex(){
    return new Date().getMinutes() % 4;
  }

  function applySeason(season){
    const root = document.documentElement.style;
    root.setProperty('--leaf-1', season.leaf1);
    root.setProperty('--leaf-2', season.leaf2);
    root.setProperty('--leaf-3', season.leaf3);
    root.setProperty('--field-1', season.field1);
    root.setProperty('--field-2', season.field2);

    // one class on <body> drives every season-specific visual behavior in CSS
    document.body.classList.remove('season-spring','season-summer','season-fall','season-winter');
    document.body.classList.add('season-' + season.name);

    // spring: replay the blooming-open animation on every flower
    // (nav flowers and the ground blossoms both use the same trick)
    if(season.name === 'spring'){
      document.querySelectorAll('.flower, .ground-bloom').forEach(el=>{
        el.style.animation = 'none';
        void el.offsetWidth; // force reflow so the animation restarts
        el.style.animation = '';
      });
    }

    // summer: replay the sunrise each time summer comes back around
    if(season.name === 'summer'){
      const sunEl = document.getElementById('sun-disc');
      sunEl.style.animation = 'none';
      void sunEl.offsetWidth;
      sunEl.style.animation = '';
    }
  }

  function spawnParticles(season){
    document.querySelectorAll('.petal-fall').forEach(p => p.remove());
    const count = season.particleCount || 14;
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'petal-fall';
      p.textContent = season.glyph;
      p.style.left = Math.random()*100 + 'vw';
      p.style.color = season.particles[i % season.particles.length];
      p.style.animationDuration = (8 + Math.random()*8) + 's';
      p.style.animationDelay = (Math.random()*10) + 's';
      p.style.fontSize = (10 + Math.random()*10) + 'px';
      body.appendChild(p);
    }
  }

  function spawnGrass(season){
    grassLayer.innerHTML = '';
    const bladeCount = 130;
    for(let i=0;i<bladeCount;i++){
      const x = 5 + Math.random()*1190;
      const y = 756 + Math.sin(x/140) * 9 + (Math.random()*10 - 5);
      const h = 20 + Math.random()*30;
      const rot = -16 + Math.random()*32;
      const bow = 2 + Math.random()*4;
      const color = season.grass[Math.floor(Math.random()*season.grass.length)];
      const delay = Math.random()*1.2;

      const g = document.createElementNS(svgNS,'g');
      g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);

      const path = document.createElementNS(svgNS,'path');
      const d = `M0,0 C${-bow},${-h*0.4} ${-bow*0.6},${-h*0.75} 0,${-h} `
               + `C${bow*0.6},${-h*0.75} ${bow},${-h*0.4} 0,0 Z`;
      path.setAttribute('d', d);
      path.setAttribute('class','blade');
      path.setAttribute('fill', color);
      path.style.animationDelay = delay.toFixed(2)+'s';

      g.appendChild(path);
      grassLayer.appendChild(g);
    }
  }

  let onSeasonChange = null; // set later, once the audio script has loaded

  let activeSeasonIndex = -1;
  function refreshSeason(){
    const idx = currentSeasonIndex();
    if(idx === activeSeasonIndex) return;
    activeSeasonIndex = idx;
    const season = SEASONS[idx];
    applySeason(season);
    spawnGrass(season);
    spawnParticles(season);
    if(onSeasonChange) onSeasonChange(season);
  }

  const seasonClockEl = document.getElementById('season-clock');
  const seasonTextEl = document.getElementById('season-text');
  const seasonHandEl = document.getElementById('season-hand');
  const wedgeEls = {
    0: document.getElementById('wedge-spring'),
    1: document.getElementById('wedge-summer'),
    2: document.getElementById('wedge-fall'),
    3: document.getElementById('wedge-winter'),
  };

  function formatCountdown(ms){
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    return `${totalSec}s`;
  }

  function updateSeasonClock(){
    const now = new Date();
    const idx = currentSeasonIndex();
    const season = SEASONS[idx];
    const nextMinute = new Date(now);
    nextMinute.setMinutes(now.getMinutes() + 1, 0, 0);
    const msLeft = nextMinute - now;

    const hh = now.getHours().toString().padStart(2,'0');
    const mm = now.getMinutes().toString().padStart(2,'0');
    const ss = now.getSeconds().toString().padStart(2,'0');

    seasonTextEl.innerHTML =
      `<span class="season-name">${season.name}</span> — ${hh}:${mm}:${ss} ` +
      `· next season in ${formatCountdown(msLeft)}`;

    // hand sweeps one full revolution every 4 minutes — its position
    // always points into whichever wedge is currently active
    const cycleSeconds = (now.getMinutes() % 4) * 60 + now.getSeconds();
    const angle = (cycleSeconds / 240) * 360;
    seasonHandEl.style.transform = `rotate(${angle.toFixed(1)}deg)`;

    Object.entries(wedgeEls).forEach(([i, el])=>{
      el.classList.toggle('active', Number(i) === idx);
    });
  }

  refreshSeason();
  updateSeasonClock();
  // tick every second: keeps the visible clock live and catches the
  // minute boundary immediately (refreshSeason no-ops unless it's
  // actually a new season, so this is cheap)
  setInterval(()=>{
    refreshSeason();
    updateSeasonClock();
  }, 1000);

  // the latest flower/leaf entrance animation-delay in the markup is
  // under 4s — waiting 5s guarantees every one of them has finished
  // blooming in before winter is ever allowed to pause anything
  setTimeout(()=>{
    document.body.classList.add('freeze-ready');
  }, 5000);

  // ---- alive flowers: lean gently toward the cursor, and drift pollen ----
  (function initAliveFlowers(){
    const svgEl = document.querySelector('.stage svg');
    if(!svgEl) return;
    const flowers = Array.from(document.querySelectorAll('.flower'));
    const pt = svgEl.createSVGPoint();

    function toSvgCoords(clientX, clientY){
      pt.x = clientX; pt.y = clientY;
      const ctm = svgEl.getScreenCTM();
      if(!ctm) return {x:0,y:0};
      const inv = pt.matrixTransform(ctm.inverse());
      return {x: inv.x, y: inv.y};
    }

    const centers = flowers.map(f=>{
      const x = parseFloat(f.getAttribute('x'))||0;
      const y = parseFloat(f.getAttribute('y'))||0;
      const w = parseFloat(f.getAttribute('width'))||0;
      const h = parseFloat(f.getAttribute('height'))||0;
      return {el:f, cx:x+w/2, cy:y+h/2};
    });

    const LEAN_RADIUS = 160;
    const MAX_LEAN_DEG = 6;

    svgEl.addEventListener('mousemove', e=>{
      const mouse = toSvgCoords(e.clientX, e.clientY);
      centers.forEach(c=>{
        const dx = mouse.x - c.cx, dy = mouse.y - c.cy;
        const dist = Math.hypot(dx, dy);
        if(dist < LEAN_RADIUS){
          const strength = 1 - dist / LEAN_RADIUS;
          const deg = Math.sign(dx || 1) * MAX_LEAN_DEG * strength;
          c.el.style.transform = `rotate(${deg.toFixed(2)}deg)`;
        } else {
          c.el.style.transform = '';
        }
      });
    });

    svgEl.addEventListener('mouseleave', ()=>{
      centers.forEach(c=> c.el.style.transform = '');
    });

    // drifting pollen near each flower
    centers.forEach(c=>{
      const color = c.el.style.color || 'var(--cream)';
      for(let i=0;i<2;i++){
        const dot = document.createElementNS(svgNS,'circle');
        const r = 1.3 + Math.random()*1.2;
        dot.setAttribute('r', r.toFixed(1));
        dot.setAttribute('cx', (c.cx + (Math.random()*12-6)).toFixed(1));
        dot.setAttribute('cy', c.cy.toFixed(1));
        dot.setAttribute('fill', color);
        dot.setAttribute('class','pollen');
        dot.style.setProperty('--drift-x', (Math.random()*16-8).toFixed(1)+'px');
        dot.style.animationDuration = (4 + Math.random()*3).toFixed(1)+'s';
        dot.style.animationDelay = (Math.random()*6).toFixed(1)+'s';
        svgEl.appendChild(dot);
      }
    });
  })();

  const musicBtn = document.getElementById('tree-bird');
  const bgMusic = document.getElementById('bg-music');
  let musicPlaying = false;

  function setPlayingUI(isPlaying){
    musicPlaying = isPlaying;
    musicBtn.classList.toggle('playing', isPlaying);
  }

  // swap the track whenever the season changes; if music was already
  // playing, keep it going seamlessly on the new season's track
  function updateTrackForSeason(season){
    bgMusic.src = season.track;
    if(musicPlaying){
      bgMusic.play().catch(()=>{});
    }
  }
  onSeasonChange = updateTrackForSeason;

  // set the correct track for whichever season is active right now,
  // then attempt autoplay (most browsers will block this until the
  // visitor has interacted with the page, in which case it fails
  // silently and the button stays in its normal click-to-play state)
  bgMusic.src = SEASONS[activeSeasonIndex].track;
  bgMusic.play()
    .then(()=> setPlayingUI(true))
    .catch(()=> setPlayingUI(false));

  musicBtn.addEventListener('click', ()=>{
    if(musicPlaying){
      bgMusic.pause();
      setPlayingUI(false);
    } else {
      bgMusic.play().then(()=> setPlayingUI(true)).catch(()=>{});
    }
  });

  musicBtn.addEventListener('keydown', e=>{
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      musicBtn.dispatchEvent(new Event('click'));
    }
  });
</script>
