<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg:#131b24;
    --bg-dot:#1c2733;
    --green:#9dff9e;
    --green-dim:#5fae6a;
    --pink:#ff3d9a;
    --purple:#8a5cf6;
    --purple-deep:#2a1750;
    --orange:#ff9f4d;
    --sky:#7fd4ff;
    --yellow:#ffd23f;
    --teal:#43e0c9;
    --bark:#6b4a8a;
    --cream:#eef4ee;
    --mono:'VT323', monospace;
    --display:'Bungee', system-ui;
    --body:'Space Grotesk', system-ui;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background-color:var(--bg);
    background-image:radial-gradient(var(--bg-dot) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--cream); font-family:var(--body);
    display:flex; flex-direction:column; align-items:center;
    padding:50px 20px 80px;
    position:relative;
    overflow:hidden;
  }
  h1{
    font-family:var(--display); font-size:1.3rem; color:var(--green);
    letter-spacing:.03em; margin:0 0 26px; z-index:2;
  }

  .stage{ position:relative; width:100%; max-width:1180px; z-index:2; }
  svg{ width:100%; height:auto; display:block; overflow:visible; }

  .branch{
    fill:none; stroke:var(--bark); stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:grow 1.4s ease forwards;
  }
  .b1{ stroke-width:9; }
  .b2{ stroke-width:6; animation-delay:.55s; }
  .b3{ stroke-width:3; animation-delay:1.5s; }
  .b2-tip{ stroke:#8a6bb0; }
  @keyframes grow{ to{ stroke-dashoffset:0; } }

  .trunk-fill{
    fill:url(#barkgrad); opacity:0;
    animation:trunkin .9s ease forwards;
  }
  @keyframes trunkin{ to{ opacity:1; } }
  .grain{
    fill:none; stroke:#3a2650; stroke-width:2; opacity:0;
    animation:grainin .8s ease forwards; animation-delay:.5s;
  }
  @keyframes grainin{ to{ opacity:.4; } }
  .ground{
    opacity:0; animation:grainin .8s ease forwards; animation-delay:.2s;
  }
  .grass{
    fill:none; stroke:var(--green-dim); stroke-width:2.5; stroke-linecap:round;
    opacity:0; animation:grainin .6s ease forwards; animation-delay:.4s;
  }
  .blade{
    transform-origin:0px 0px;
    opacity:0;
    animation:bladein .55s ease forwards;
  }
  @keyframes bladein{
    from{ opacity:0; transform:scaleY(.15); }
    to{ opacity:.95; transform:scaleY(1); }
  }

  .leaf{
    opacity:0;
    animation:leafin .5s ease forwards;
    transform-origin:center;
  }
  .leaf path{ fill:var(--green-dim); }
  .leaf line{ stroke:rgba(0,0,0,.3); stroke-width:1; }
  @keyframes leafin{ from{opacity:0; transform:scale(.3);} to{opacity:.9; transform:scale(1);} }

  .label{
    font-family:var(--mono); font-size:20px; letter-spacing:.05em;
    opacity:0; animation:fadein .6s ease forwards;
  }
  @keyframes fadein{ to{ opacity:1; } }

  .flower{
    cursor:pointer; opacity:0;
    animation:bloom .6s cubic-bezier(.2,1.6,.4,1) forwards;
    transform-origin:center;
  }
  @keyframes bloom{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(1);} }
  .flower:hover{ filter:brightness(1.3); }
  .petal{ transition:transform .15s ease; }
  .flower:hover .petal{ transform:scale(1.12); }

  .petal-fall{
    position:absolute; top:-20px; font-size:14px;
    animation:fall linear infinite;
    z-index:1; opacity:.8;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(760px) rotate(360deg); }
  }

  /* ---- mobile only: desktop is untouched above 700px.
     Just center the tree in the viewport instead of it sitting at top. ---- */
  @media (max-width:700px){
    body{ justify-content:center; min-height:100vh; }
  }
</style>

  document.querySelectorAll('.flower').forEach(node=>{
    node.addEventListener('click', ()=>{
      const href = node.dataset.href;
      if(href) window.location.href = href;
    });
  });

  const petalColors = ['#ff3d9a','#ff9f4d','#7fd4ff','#ffd23f','#9dff9e','#8a5cf6'];
  const body = document.body;
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className = 'petal-fall';
    p.textContent = '❁';
    p.style.left = Math.random()*100 + 'vw';
    p.style.color = petalColors[i % petalColors.length];
    p.style.animationDuration = (8 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.fontSize = (10 + Math.random()*10) + 'px';
    body.appendChild(p);
  }

  // generate a dense, naturalistic field of tapered grass blades
  const svgNS = 'http://www.w3.org/2000/svg';
  const grassLayer = document.getElementById('grassLayer');
  const bladeColors = ['#5fae6a','#7bc98a','#3f7a52','#8fd99c'];
  const bladeCount = 130;
  for(let i=0;i<bladeCount;i++){
    const x = 5 + Math.random()*1190;
    const y = 756 + Math.sin(x/140) * 9 + (Math.random()*10 - 5);
    const h = 20 + Math.random()*30;
    const rot = -16 + Math.random()*32;
    const bow = 2 + Math.random()*4;
    const color = bladeColors[Math.floor(Math.random()*bladeColors.length)];
    const delay = Math.random()*1.2;

    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);

    const path = document.createElementNS(svgNS,'path');
    const d = `M0,0 C${-bow},${-h*0.4} ${-bow*0.6},${-h*0.75} 0,${-h} `
             + `C${bow*0.6},${-h*0.75} ${bow},${-h*0.4} 0,0 Z`;
    path.setAttribute('d', d);
    path.setAttribute('class','blade');
    path.setAttribute('fill', color);
    path.style.animationDelay = delay.toFixed(2)+'s';

    g.appendChild(path);
    grassLayer.appendChild(g);
  }
</script>

</body>
</html>
