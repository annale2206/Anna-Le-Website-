<script type="module">
// Multiplayer on annale22.com: guests find each other peer-to-peer (WebRTC), no server or sign-in needed.
import {joinRoom} from './garden-life-p2p.js';
try{
  const room=joinRoom({appId:'annale22.com/garden-life'},'valley');
  const act=room.makeAction('pres'), peers=new Map(); let last=null;
  act.onMessage=(d,ctx)=>{ if(d&&typeof d==='object'&&!Array.isArray(d)) peers.set(ctx.peerId,{p:d,t:Date.now()}); };
  room.onPeerJoin=id=>{ if(last) act.send(last,{target:id}).catch(()=>{}); };
  room.onPeerLeave=id=>{ peers.delete(id); };
  setInterval(()=>{ if(last) act.send(last).catch(()=>{}); },4000);
  addEventListener('pagehide',()=>{ try{ room.leave(); }catch(e){} });
  window.__p2pResolve({
    presence:async st=>{ last=st; try{ await act.send(st); }catch(e){} },
    peers:()=>{ const now=Date.now(), out=[]; for(const [id,v] of peers){ if(now-v.t>60000){ peers.delete(id); continue; } out.push({peer:id,presence:v.p,by:null,kind:'viewer',sameTab:false}); } return out; },
    onPeers:()=>{}
  });
}catch(e){ window.__p2pResolve(null); }
</script>

/* ---------- fishing ---------- */
let fishing=null; const bobber=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),std(0xe2566e,{emissive:0x441111})); bobber.visible=false; scene.add(bobber);
const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]); const fishLine=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xeeeeee,transparent:true,opacity:.7})); fishLine.visible=false; scene.add(fishLine);
let leaper=null;
function startFishing(spot){ P.mode="fish"; P.x=spot.x; P.z=spot.z; P.face=0; camYaw=Math.PI-.7; camPitch=.3; fishing={state:"ready",spot}; renderFishing(); }
function renderFishing(){
  const f=fishing; if(!f) return; if(J.keptDay!==dayKey()){ J.keptDay=dayKey(); J.keptToday=0; }
  let body="",act="";
  if(f.state==="ready"){ body="<p>The river runs clear over the stones. You can see fish turning in the current.</p>"; act=`<button id="fLeave">Leave the bank</button><button class="primary" id="fCast">Cast your line</button>`; }
  if(f.state==="wait"){ body="<p>The bobber drifts. You wait and listen to the water.</p>"; act=`<button id="fLeave">Reel in and leave</button>`; }
  if(f.state==="bite"){ body="<p><b>The bobber dips!</b></p>"; act=`<button class="primary bite" id="fPull">Pull now</button>`; }
  if(f.state==="miss"){ body="<p>It slipped away. The ripples smooth over.</p>"; act=`<button id="fLeave">Leave the bank</button><button class="primary" id="fCast">Cast again</button>`; }
  if(f.state==="caught"){ const can=J.keptToday<2;
    body=`<div class="fishcard" id="fishCard"></div><p>A <b>${esc(f.fish.n)}</b>, ${f.fish.len} inches, cool and bright in your hands.</p><p class="meta">${can?"Take only what you need. You can keep up to two a day.":"You already kept two today. This one goes back."}</p>`;
    act=`<button id="fRelease" class="${can?"":"primary"}">Thank it and let it go</button>${can?`<button class="primary" id="fKeep">Keep it for the fire</button>`:""}`; }
  openSheet(`<div class="eyebrow">The riverbank</div><h2>Fishing</h2>${body}<div class="actions">${act}</div>`,{low:true,close:endFishing});
  const fc=$("fishCard"); if(fc) fc.appendChild(drawFishCard(f.fish.sp,f.fish.len));
  const on=(id,fn)=>{ const b=$(id); if(b) b.onclick=fn; };
  on("fCast",cast); on("fLeave",closeSheet); on("fPull",pull);
  on("fKeep",()=>{ add("fish"); J.got.fish++; J.keptToday++; pop("+1 "+f.fish.n.toLowerCase()); J.catches[f.fish.n]=(J.catches[f.fish.n]||0)+1; persist(); task("fish"); toast(`You keep the ${f.fish.n.toLowerCase()} and put it in your basket.`); stowFish(); fishing.state="ready"; renderFishing(); });
  on("fRelease",()=>{ J.gave.released++; J.catches[f.fish.n]=(J.catches[f.fish.n]||0)+1; persist(); task("fish"); task("release"); toast(`The ${f.fish.n.toLowerCase()} flicks its tail and is gone.`); clearHandFish(); splash(); fishing.state="ready"; renderFishing(); });
}
function clearHandFish(){ while(C.handFish.children.length) C.handFish.remove(C.handFish.children[0]); P.fishShow=0; }
function cast(){ const f=fishing; f.state="wait"; f.biteAt=performance.now()+2500+Math.random()*6000; const x=f.spot.x+(Math.random()-.5)*2;
  f.pos=new THREE.Vector3(x,.04,riverZ(x)-1.2+Math.random()*1.2); bobber.position.copy(f.pos); bobber.visible=fishLine.visible=true; plop(); renderFishing(); }
function pull(){ const f=fishing; if(f.state!=="bite") return; const sp=SPECIES[Math.floor(Math.random()*SPECIES.length)]; const len=Math.round(sp.min+Math.random()*(sp.max-sp.min));
  f.fish={n:sp.n,len,sp}; f.state="caught"; bobber.visible=fishLine.visible=false; splash();
  const fm=makeFish(sp); fm.scale.setScalar(.25+len*.03); leaper={f:fm,t:0,from:f.pos.clone()}; scene.add(fm); renderFishing(); }
const tipW=new THREE.Vector3(), handW=new THREE.Vector3();
function updateFishing(now,t,dt){ if(leaper){ leaper.t+=dt/0.7; C.armR.getWorldPosition(handW); handW.y-=.4; const k=Math.min(1,leaper.t);
    leaper.f.position.lerpVectors(leaper.from,handW,k); leaper.f.position.y+=Math.sin(k*Math.PI)*1.6; leaper.f.rotation.set(k*6,0,0);
    if(k>=1){ scene.remove(leaper.f); clearHandFish(); leaper.f.rotation.set(Math.PI/2,0,0); leaper.f.position.set(0,0,0); leaper.f.scale.multiplyScalar(1); C.handFish.add(leaper.f); P.fishShow=performance.now()+1e9; leaper=null; } }
  if(C.handFish.children[0]) C.handFish.children[0].userData.tail.rotation.y=Math.sin(t*14)*.4;
  if(!fishing) return; const f=fishing;
  if(bobber.visible){ let y=.04+Math.sin(t*2.2)*.025; if(f.state==="bite") y-=.1+Math.sin(t*25)*.04; bobber.position.set(f.pos.x+Math.sin(t*.6)*.15,y,f.pos.z);
    C.rodTip.getWorldPosition(tipW); const a=lineGeo.attributes.position; a.setXYZ(0,tipW.x,tipW.y,tipW.z); a.setXYZ(1,bobber.position.x,bobber.position.y,bobber.position.z); a.needsUpdate=true; }
  if(f.state==="wait"&&now>f.biteAt){ f.state="bite"; f.missAt=now+1400; plop(); renderFishing(); }
  else if(f.state==="bite"&&now>f.missAt){ f.state="miss"; bobber.visible=fishLine.visible=false; renderFishing(); } }
function endFishing(){ fishing=null; bobber.visible=fishLine.visible=false; P.mode="walk"; if(C.handFish.children.length) P.fishShow=performance.now()+2500; }

function lieDown(){ sitAt({x:HILL.x,y:HILL_Y+.14,z:HILL.z,face:.4,sky:1},"lie"); lookYaw=camYaw; lookPitch=1.1; const isNight=night>.6;
  openSheet(`<div class="eyebrow">The hilltop</div><h2>Looking up</h2>

function updateShoot(t){ const btn=$("sWish");
  if(P.mode==="lie"&&P.seat&&P.seat.sky&&night>.6&&!shootState&&t>nextShoot){ const yaw=lookYaw+(Math.random()-.5)*1.1,el=.75+Math.random()*.5;
    const c=new THREE.Vector3(-Math.sin(yaw)*Math.cos(el),Math.sin(el),-Math.cos(yaw)*Math.cos(el)).multiplyScalar(400);
    const dir=new THREE.Vector3(Math.random()-.5,-.3-Math.random()*.3,Math.random()-.5).normalize().multiplyScalar(120);
    shootState={start:t,dur:1.6,a:c.clone().sub(dir.clone().multiplyScalar(.5)),dir,wished:false}; }
  if(shootState){ const k=(t-shootState.start)/shootState.dur;
    if(k>1){ shootState=null; shootMat.opacity=0; nextShoot=t+5+Math.random()*9; if(btn) btn.disabled=true; }
    else { const h=shootState.a.clone().addScaledVector(shootState.dir,k),tl=shootState.a.clone().addScaledVector(shootState.dir,Math.max(0,k-.25)),cp=camera.position,pa=shootGeo.attributes.position;

      let hd=1.2+Math.random()*.8, tx=r.x+Math.sin(a)*hd,tz=r.z+Math.cos(a)*hd; if(Math.hypot(tx-r.home.x,tz-r.home.z)>18){ a=Math.atan2(r.home.x-r.x,r.home.z-r.z); tx=r.x+Math.sin(a)*hd; tz=r.z+Math.cos(a)*hd; }
      if(H(tx,tz)>.3&&!inGBed(tx,tz)&&gridFree(tx,tz)&&!blocked(tx,tz)){ r.from={x:r.x,z:r.z}; r.to={x:tx,z:tz}; r.hop=0; r.face=a; } else r.wait=1; }
    let hy=0; if(r.to){ r.hop+=dt*2.6; const k=Math.min(1,r.hop); r.x=r.from.x+(r.to.x-r.from.x)*k; r.z=r.from.z+(r.to.z-r.from.z)*k; hy=Math.sin(k*Math.PI)*.3; if(k>=1){ r.to=null; r.wait=pd<4?.15:.8+Math.random()*3; } }
    r.g.position.set(r.x,H(r.x,r.z)+hy,r.z); r.g.rotation.y=r.face; r.legs.forEach(l=>{ l.hip.rotation.x=r.to?(l.front?-.6:.9)*Math.sin(Math.min(1,r.hop)*Math.PI):0; }); r.hd.rotation.x=r.to?-.2:Math.sin(t*3+r.home.x)*.08; }
  // deer
  for(const d of deer){ d.graze-=dt; if(d.graze<0){ if(d.tx==null||Math.random()<.5){ d.tx=DEERM.x+(Math.random()-.5)*44; d.tz=Math.max(riverZ(d.tx)+RW/2+5,DEERM.z+(Math.random()-.5)*26); } d.graze=6+Math.random()*10; }
    const dx=d.tx-d.x,dz=d.tz-d.z,dd=Math.hypot(dx,dz); const moving=d.tx!=null&&dd>.5&&d.graze<5;
    if(moving){ d.face=lerpAng(d.face,Math.atan2(dx,dz),dt*2); const nx=d.x+Math.sin(d.face)*dt*1.1, nz=d.z+Math.cos(d.face)*dt*1.1; if(gridFree(nx,nz)&&H(nx,nz)>.2){ d.x=nx; d.z=nz; } else { d.tx=null; d.graze=3; } }
    animQuad(d,moving?1:0,dt,t,6); d.neck.rotation.x=moving?.4:1.9+Math.sin(t*.7)*.12; d.hd.rotation.y=moving?0:Math.sin(t*.5+d.x)*.2; d.g.position.set(d.x,H(d.x,d.z),d.z); d.g.rotation.y=d.face; }
  // butterflies
  const dayVis=night<.55&&curSeason!=="winter"&&W.rain<.5;
  for(const b of butterflies){ b.g.visible=dayVis; if(!dayVis) continue; const k=t*b.sp+b.ph;
    const x=b.h.x+Math.sin(k)*b.r+Math.sin(k*2.3)*.8, z=b.h.z+Math.cos(k*.8)*b.r*.8+Math.cos(k*1.7)*.6, y=Math.max(H(x,z),0)+.6+Math.sin(k*3)*.35;
    let bx=x,by=y,bz=z; const pd=Math.hypot(P.x-x,P.z-z); if(pd<2.2){ const k=(2.2-pd)*1.4; bx+=(x-P.x)/(pd||1)*k; bz+=(z-P.z)/(pd||1)*k; by+=k*.4; }
    b.g.position.set(bx,by,bz); b.g.rotation.y=Math.atan2(Math.cos(k)*b.r,-Math.sin(k*.8)*b.r*.8); const f=Math.sin(t*16+b.ph)*.9; b.pl.rotation.z=f; b.pr.rotation.z=-f;
    if(Math.hypot(P.x-x,P.z-z)<1.6&&!b.seen){ b.seen=true; task("butterfly"); toast("A butterfly drifts right past your shoulder.",2600); } }
  // songbirds
  for(const fl of flocks){ fl.birds.forEach((b,i)=>{ const a=t*fl.sp+b.ph; b.g.position.set(fl.c.x+Math.cos(a)*fl.c.r,fl.c.y+Math.sin(t*.7+b.dy)*1.5+i*.4,fl.c.z+Math.sin(a)*fl.c.r); b.g.rotation.y=-a;
    const f=Math.sin(t*14+i)*.8; b.pl.rotation.z=f; b.pr.rotation.z=-f; b.g.visible=night<.5; }); }
  perched.forEach(b=>{ b.t-=dt; if(b.t<0){ b.t=1+Math.random()*4; b.g.rotation.y=(Math.random()-.5)*3; } b.g.children[1].position.y=.05+Math.max(0,Math.sin(t*6+b.g.id))*.02; b.g.visible=night<.5; });
  // fish in the river
  for(const s of swimmers){ s.x+=s.sp*dt*s.dir; if(s.x>110) s.x=-110; if(s.x<-110) s.x=110; const z=riverZ(s.x)+s.off+Math.sin(t*.6+s.ph)*.4;
    s.f.position.set(s.x,-.45+Math.sin(t+s.ph)*.08,z); s.f.rotation.y=s.dir>0?Math.PI/2:-Math.PI/2; s.f.userData.tail.rotation.y=Math.sin(t*8+s.ph)*.4; }
}

/* ================= loop ================= */
const clock=new THREE.Clock(); let promptT=0,presT=0,lastPlotSec=-1;
function loop(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime,now=performance.now(); TIME.value=t; rU.uTime.value=t;
  updatePlayer(dt,t); updateCamera(dt); updateSky(dt,t); updateFishing(now,t,dt); updateShoot(t); regrow(now); updateAudio(t); updateAnimals(dt,t); updateDucks(dt,t); updateSquirrels(dt,t); updateJumps(dt,t); updateFx(dt); updatePlotAnim(dt); updateClouds(dt); updateTrail(dt,t); updateWeather(dt,t); updateDJ(dt,t); updateFalls(t); updateSwing(dt); updateExtraFires(t); updateCook(dt,t); updateCrumbs(); updateCampfire(t); updateCat(dt,t); updateChickens(dt,t); updateFrogs(dt,t); updateDragonflies(dt,t); updateHedgehogs(dt,t); updateRobins(dt,t); updateOthers(dt,t); updateHunt(dt,t); updateHeadMenu();
  if((presT+=dt)>.12){ presT=0; sendPresence(false); }
  smoke.forEach(s=>{ s.userData.t=(s.userData.t+dt*.07)%1; const k=s.userData.t; s.position.set(chimTop.x+Math.sin(k*6+t*.3)*k*1.5+k*2,chimTop.y+k*9,chimTop.z+k*1.2);
    const sc=.6+k*3; s.scale.set(sc,sc,1); s.material.opacity=.32*(1-k)*Math.min(1,k*6); s.material.color.setScalar(.5+.45*(1-night)); });
  const lit=fireLit(); flames.forEach((f,i)=>{ f.visible=lit; f.scale.set(1+Math.sin(t*11+i)*.1,.85+Math.sin(t*9+i*2)*.18,1+Math.cos(t*13+i)*.1); f.rotation.y=t*(i+1); });
  embers.visible=lit; if(lit){ emS.forEach((e,i)=>{ e.t=(e.t+dt*.5)%1; emP[i*3]=e.x+Math.sin(e.t*8+i)*.2; emP[i*3+1]=.5+e.t*3; emP[i*3+2]=e.z+Math.cos(e.t*7+i)*.2; }); embers.geometry.attributes.position.needsUpdate=true; }
  fireLight.intensity=lit?1.9+Math.sin(t*13)*.25+Math.sin(t*29)*.15:0; stoveGlow.emissiveIntensity=1+Math.sin(t*5)*.2;
  for(let i=0;i<ffN;i++){ const f=ffSeed[i]; ffP[i*3]=f.x+Math.sin(t*.3+f.p)*2; ffP[i*3+1]=f.y+Math.sin(t*.7+f.p*2)*.5; ffP[i*3+2]=f.z+Math.cos(t*.25+f.p)*2; } ffGeo.attributes.position.needsUpdate=true;
  ffMat.size=.22+.08*Math.sin(t*2.2);
  for(let i=0;i<beeN;i++){ const b=beeSeed[i]; beeP[i*3]=b.x+Math.sin(t*1.3+b.ph)*1.2; beeP[i*3+1]=b.y+Math.sin(t*3+b.ph)*.15; beeP[i*3+2]=b.z+Math.cos(t*1.1+b.ph*1.3)*1.2; } beeGeo.attributes.position.needsUpdate=true; beeMat.opacity=(1-night)*(curSeason==="winter"||W.rain>.5?0:1);
  if(!reduce) heronHead.position.y=1.95+Math.sin(t*.7)*.02;
  if(!geese.visible && t>nextGeese && night<.5){ geese.visible=true; geeseT=0; const a=Math.random()*6.283; geese.userData={a,sx:C.g.position.x-Math.cos(a)*220,sy:42+Math.random()*10,sz:C.g.position.z-Math.sin(a)*220}; geese.rotation.y=Math.atan2(Math.cos(a),Math.sin(a)); honk(); }
  if(geese.visible){ geeseT+=dt; const u=geese.userData; geese.position.set(u.sx+Math.cos(u.a)*geeseT*12,u.sy,u.sz+Math.sin(u.a)*geeseT*12);
    goose.forEach(g=>{ const f=Math.sin(t*5+g.ph)*.5; g.pl.rotation.z=f; g.pr.rotation.z=-f; }); if(geeseT>2&&Math.random()<.004) honk();
    if(geeseT>38){ geese.visible=false; nextGeese=t+90+Math.random()*90; } }
  if((promptT+=dt)>.12){ promptT=0; updatePrompt(); if(Math.floor(t)%5===0) updateBeds(); if(Math.floor(t)!==lastPlotSec){ lastPlotSec=Math.floor(t); updatePlots(); updateWild(); updateVeg(); } }
  updateBubbles(); autoQuality(dt); renderer.render(scene,camera); requestAnimationFrame(loop);
}
let aqT=0,aqN=0,aqSum=0;
function autoQuality(dt){ if(!touch||document.hidden||dt>.5) return; aqSum+=dt; aqN++; if((aqT+=dt)<3) return;
  const avg=aqSum/aqN; aqT=aqSum=aqN=0;
  if(avg>1/26&&PR>1.25){ PR=Math.max(1.25,PR-.25); renderer.setPixelRatio(PR); resize(); }
  else if(avg<1/50&&PR<Math.min(devicePixelRatio||1,2)){ PR=Math.min(Math.min(devicePixelRatio||1,2),PR+.25); renderer.setPixelRatio(PR); resize(); } }
buildGrid(); updateWild(); updateVeg();
C.g.position.set(P.x,groundY(P.x,P.z),P.z); C.g.rotation.y=P.face; camera.position.set(P.x,4,P.z-8); renderBasket(); renderTasks(); updateBeds(); updatePlots(); updateShelfVis(); if(J.name) setMyLabel();
setInterval(()=>{ if(J.tasks.day!==dayKey()) renderTasks(); },60000);
requestAnimationFrame(loop);

/* ================= check-in ================= */
function visitCount(){ if(J.lastDay!==dayKey()){ J.visits++; J.lastDay=dayKey(); persist(); } }
let profile=null;
let welcomed=false;
function welcome(){
  const me=profile, sw=k=>LOOK[k].map((c,i)=>`<button data-k="${k}" data-i="${i}" aria-label="${k} color ${i+1}" aria-pressed="${J.look[k]===i}" style="background:#${c.toString(16).padStart(6,"0")}"></button>`).join("");
  openSheet(`<div class="eyebrow">A homestay on the river</div><h2>Welcome to Garden Life</h2>
    <p>Cabins by the river for reading, cooking, sleeping, music and art, a fruit garden, meadows and woods. Day and night follow your real clock. Stand still and choices appear above your head: pick berries, grow mangoes and oranges, read, fish, find mushrooms, feed the ducks. Take only what is given, and give something back.</p>
    <label class="meta" for="nameIn">Your name, shown above your head</label>
    <input type="text" id="nameIn" maxlength="20" placeholder="Type a name" autocomplete="off" value="${esc(J.name||(me&&me.name)||"")}">
    <p class="meta" id="nameErr" style="margin:6px 0 0" hidden>Type a name so other guests know who you are.</p>
    <h3>How you look</h3><div class="chips" id="gPick"><button data-g="0" aria-pressed="${(J.look.g||0)===0}">Female</button><button data-g="1" aria-pressed="${J.look.g===1}">Male</button></div><div class="meta">Shirt</div><div class="swatches">${sw("shirt")}</div><div class="meta">Dress or shorts</div><div class="swatches">${sw("pants")}</div><div class="meta">Hair</div><div class="swatches">${sw("hair")}</div><div class="meta">Skin</div><div class="swatches">${sw("skin")}</div>
    <div class="keys">${touch?`<b>Pad</b><span>walk (push to the edge to run)</span><b>Drag</b><span>turn the view</span><b>Above you</b><span>tap a choice and your character walks there</span>`
      :`<b>W A S D</b><span>walk, hold Shift to run</span><b>Drag</b><span>turn the view, scroll to zoom</span><b>Above you</b><span>click a choice and your character walks there</span><b>E</b><span>interact when something is near</span><b>Enter</b><span>say something to other guests</span>`}</div>
    <p class="meta">Your progress is saved on this device. Other guests who are here at the same time appear walking with their names.</p>
    <div class="actions"><button class="primary" id="wGo">Step outside</button></div>`,{center:true,close:()=>{ if(!J.name) J.name="Guest "+(100+Math.floor(Math.random()*900)); setMyLabel(); welcomed=true; visitCount(); sendPresence(true); }});
  $("card").querySelectorAll(".swatches button").forEach(b=>b.onclick=()=>{ J.look[b.dataset.k]=+b.dataset.i; applyLookTo(C,lookArr()); persist();
    $("card").querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("card").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ J.look.g=+b.dataset.g; applyLookTo(C,lookArr()); persist(); $("card").querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  const ni=$("nameIn"); if(!touch&&!ni.value) ni.focus();
  const go=()=>{ const v=clean(ni.value,20); if(!v){ $("nameErr").hidden=false; ni.focus(); return; } J.name=v; persist(); if(!AC){ $("bSound").setAttribute("aria-pressed","true"); startAudio(); } closeSheet(); };
  $("wGo").onclick=go; ni.onkeydown=e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); go(); } };
}
welcome();
$("whoHere").textContent="";
/* ===== shared valley through the website's own server =====
   Direct peer-to-peer links fail between many networks (phone carriers, other countries),
   so every guest ALSO checks in with /api/garden (Upstash Redis) a little more than once a second.
   Peer-to-peer guests stay silky-smooth; everyone else still appears through the server. */
let GID=""; try{ GID=sessionStorage.getItem("gl-gid")||""; }catch(e){}
if(!GID){ GID=Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,8); try{ sessionStorage.setItem("gl-gid",GID); }catch(e){} }
function valleyRoom(p2p){
  let mine=null, srv=new Map(), busy=false, alone=true, next=0, fails=0;
  async function tick(){ if(busy||!mine||Date.now()<next) return; busy=true; next=Date.now()+(alone?4000:800);
    try{ const r=await fetch("/api/stats?valley=1",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:GID,st:mine})});
      const j=await r.json(); const m=new Map();
      for(const [id,v] of Object.entries((j&&j.players)||{})){ if(id===GID||!v||!v.st||typeof v.st.x!=="number") continue; m.set(id,{peer:"s:"+id,kind:"viewer",presence:v.st,slow:true}); }
      srv=m; alone=m.size===0; fails=0; }
    catch(e){ fails++; next=Date.now()+Math.min(30000,fails*3000); }
    busy=false; }
  setInterval(tick,200);
  addEventListener("pagehide",()=>{ try{ navigator.sendBeacon("/api/stats?valley=1",JSON.stringify({id:GID,leave:1})); }catch(e){} });
  return {
    presence(st){ mine=st; if(p2p){ try{ p2p.presence(st); }catch(e){} } return Promise.resolve(); },
    peers(){ const out=[], seen=new Set();
      if(p2p){ for(const p of p2p.peers()){ const g=p.presence&&p.presence.gid; if(g){ if(seen.has(g)) continue; seen.add(g); } out.push(p); } }
      for(const [id,p] of srv) if(!seen.has(id)) out.push(p);
      return out; },
    onPeers(){} };
}
(async()=>{ if(!window.claude||!window.claude.use){ let p2p=null;
    try{ p2p=window.__p2p?await Promise.race([window.__p2p,new Promise(r=>setTimeout(()=>r(null),4000))]):null; }catch(e){}
    room=valleyRoom(p2p); sendPresence(true); return; }
  try{ const [u,d,r]=await Promise.all([claude.use("user"),claude.use("db"),claude.use("room")]); user=u; db=d; room=r;
    if(user){ profile=await user.me(); myId=profile.id; const ni=$("nameIn"); if(ni&&!ni.value&&profile.name) ni.value=clean(profile.name,20); }
    if(room){ sendPresence(true); room.onPeers(()=>{},()=>{ room=null; }); }
    if(db&&myId){ try{ const snap=await db.collection("data/users/"+myId).doc("journal").get();
      if(snap.exists){ const rj=snap.data()||{}; const mergeNum=(a,b)=>{ for(const k in b) if(typeof b[k]==="number") a[k]=Math.max(a[k]||0,b[k]); };
        mergeNum(J.got,rj.got||{}); mergeNum(J.gave,rj.gave||{}); ["meals","readings","wishes","visits"].forEach(k=>{ if(typeof rj[k]==="number") J[k]=Math.max(J[k]||0,rj[k]); });
        if(rj.inv&&typeof rj.inv==="object"&&Object.keys(J.inv).length===0) J.inv=rj.inv; if(rj.look) Object.assign(J.look,rj.look); if(rj.kin) Object.assign(J.kin,rj.kin);
        if(rj.catches) for(const k in rj.catches) J.catches[k]=Math.max(J.catches[k]||0,rj.catches[k]|0);
        if(Array.isArray(rj.beds)&&rj.beds.length===4) J.beds=J.beds.map((v,i)=>v||rj.beds[i]||0);
        if(rj.tasks&&rj.tasks.day===dayKey()&&J.tasks.day!==dayKey()) J.tasks=rj.tasks;
        if(typeof rj.firstVisit==="number") J.firstVisit=Math.min(J.firstVisit,rj.firstVisit); if(typeof rj.lastDay==="string"&&rj.lastDay) J.lastDay=rj.lastDay>J.lastDay?rj.lastDay:J.lastDay;
        if(rj.keptDay===dayKey()&&typeof rj.keptToday==="number"){ J.keptDay=rj.keptDay; J.keptToday=Math.max(J.keptToday,rj.keptToday); }
        if(Array.isArray(rj.orchard)&&rj.orchard.length===6&&J.orchard.every(x=>!x)) J.orchard=rj.orchard; if(typeof rj.can==="number") J.can=Math.max(J.can,rj.can);
        applyLookTo(C,lookArr()); renderTasks(); updateBeds(); updatePlots(); } persist(); }catch(e){} }
    if(db){ db.collection("gifts").orderBy("at","desc").limit(40).onSnapshot(qs=>{ giftDocs=qs.docs.map(x=>x.data()).filter(Boolean); renderGuestList(); },()=>{});
      woodDoc=db.collection("commons").doc("woodpile"); woodDoc.onSnapshot(s=>{ sharedKindling=s.exists?((s.data()||{}).count||0):0; },()=>{}); }
  }catch(e){} })();
})();
