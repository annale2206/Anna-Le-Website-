<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>identity machine — research lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{
    width:100%; height:100%; overflow:hidden;
    background:#0a0d10;
    font-family:'Space Mono', monospace;
    color:#c8d4d8;
    user-select:none;
  }

  /* faint lab grid across the whole background */
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(67,224,201,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(67,224,201,.05) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
  }

  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
    z-index:1;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- dashboard bar, visible once past the gate ---------- */
  #dashboard{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:center; gap:60px;
    padding:18px 20px;
    background:#0d1114;
    border-bottom:1px solid #1e2a2e;
    z-index:20;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  #dashboard.active{ opacity:1; }
  .stat{ text-align:center; }
  .stat-label{
    font-size:11px; letter-spacing:.15em; color:#5a6f75;
    text-transform:uppercase;
  }
  .stat-value{
    font-size:28px; color:#43e0c9; font-weight:700;
    letter-spacing:.05em;
  }

  /* ---------- gate ---------- */
  #gate{ flex-direction:column; gap:36px; }
  .gate-label{
    font-size:13px; letter-spacing:.3em; color:#5a6f75; text-transform:uppercase;
  }
  .dots{ display:flex; gap:18px; }
  .dot{
    width:14px; height:14px; border-radius:2px;
    border:1.5px solid #2a3a3f;
    transition:background .15s ease, border-color .15s ease;
  }
  .dot.filled{ background:#43e0c9; border-color:#43e0c9; }
  .dot.err{ background:#ff3d5a; border-color:#ff3d5a; }
  .keypad{ display:grid; grid-template-columns:repeat(3, 64px); gap:14px; }
  .key{
    width:64px; height:64px; border-radius:4px;
    background:#0d1114; border:1px solid #2a3a3f;
    color:#8a9aa0; font-family:'Space Mono', monospace; font-size:22px;
    cursor:pointer;
  }
  .key:active{ background:#141c20; border-color:#43e0c9; color:#43e0c9; }
  .key.blank{ border:none; background:none; cursor:default; }
  .key.blank:active{ background:none; border:none; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px); }
    40%{ transform:translateX(10px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }
  .dots.shake{ animation:shake .4s ease; }

  /* ---------- lab module framing (used for all three capture stages) ---------- */
  #floor{ gap:2.4vw; padding-top:70px; }
  .module{ display:flex; flex-direction:column; align-items:center; }
  .module-label{
    font-size:13px; letter-spacing:.15em; color:#43e0c9;
    text-transform:uppercase; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .module-label .stage-num{
    background:#43e0c9; color:#0a0d10;
    font-weight:700; padding:1px 7px; border-radius:2px;
    font-size:12px;
  }
  .rig{
    position:relative;
    width:26vw; max-width:380px; aspect-ratio:4/3;
    background:#0d1114;
    border:1px solid #1e2a2e;
  }
  .corner{
    position:absolute; width:18px; height:18px;
    border-color:#43e0c9; z-index:6; pointer-events:none;
  }
  .corner.tl{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }

  .rig-screen{
    position:relative; width:100%; height:100%;
    overflow:hidden; background:#000; cursor:default;
  }
  .rig-screen.tappable{ cursor:pointer; }
  .rig video, .rig-screen img, .rig-screen canvas, .rig-screen video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  #video{
    transform:scaleX(-1); /* mirror the live preview, like a normal mirror */
  }
  .status-led{
    display:flex; align-items:center; gap:8px;
    margin-top:10px; font-size:12px; letter-spacing:.1em; color:#5a6f75;
    text-transform:uppercase;
  }
  .led-dot{
    width:7px; height:7px; border-radius:50%;
    background:#2a3a3f;
    transition:background .3s ease, box-shadow .3s ease;
  }
  .led-dot.on{ background:#43e0c9; box-shadow:0 0 6px #43e0c9; }
  .led-dot.pulse{ animation:led-pulse 1s ease-in-out infinite; }
  @keyframes led-pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  .static-canvas{ position:absolute; inset:0; width:100%; height:100%; }

  .ring{
    position:absolute; z-index:2; top:50%; left:50%;
    width:15%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(67,224,201,.6);
    animation:pulse 2.4s ease-in-out infinite; pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.5; }
    50%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; }
  }

  .rig-screen img.reveal, .rig-screen video.reveal{
    opacity:0; animation:reveal 1.1s ease forwards;
  }
  @keyframes reveal{
    from{ opacity:0; filter:brightness(2) contrast(1.4); transform:scale(1.04); }
    to{ opacity:1; filter:brightness(1) contrast(1); transform:scale(1); }
  }
  .glitch-bar{ position:absolute; z-index:3; }

  /* ---------- text prompt input screens ---------- */
  .prompt-screen{ flex-direction:column; gap:24px; padding:20px; }
  .prompt-title{
    font-size:14px; letter-spacing:.2em; color:#43e0c9; text-transform:uppercase;
  }
  .prompt-input{
    width:min(600px, 90vw);
    background:#0d1114; border:1px solid #2a3a3f;
    color:#c8d4d8; font-family:'Space Mono', monospace; font-size:16px;
    padding:18px 20px; resize:none;
    height:110px;
  }
  .prompt-input:focus{ outline:none; border-color:#43e0c9; }
  .prompt-input::placeholder{ color:#3f4d52; }
  .prompt-submit{
    padding:14px 40px;
    background:#43e0c9; border:none; color:#0a0d10;
    font-family:'Space Mono', monospace; font-size:14px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase;
    cursor:pointer;
  }
  .prompt-submit:active{ background:#35b8a4; }
  .prompt-skip{
    background:none; border:none; color:#5a6f75;
    font-family:'Space Mono', monospace; font-size:12px;
    letter-spacing:.1em; text-decoration:underline; cursor:pointer;
  }

  #error-msg{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; color:#ff3d5a; font-size:20px; letter-spacing:.03em;
    background:rgba(10,13,16,.94);
    opacity:0; pointer-events:none; transition:opacity .3s ease;
    z-index:50; padding:40px;
  }
  #error-msg.show{ opacity:1; pointer-events:auto; }
  #error-msg span{ max-width:520px; line-height:1.6; }

  @media (max-width:900px){
    #floor{ flex-direction:column; gap:5vh; padding-top:110px; }
    .rig{ width:78vw; }
    #dashboard{ flex-wrap:wrap; gap:24px; }
  }
</style>
</head>
<body>

<div id="dashboard">
  <div class="stat">
    <div class="stat-label">Participants</div>
    <div class="stat-value" id="stat-participants">000</div>
  </div>
  <div class="stat">
    <div class="stat-label">Portraits Archived</div>
    <div class="stat-value" id="stat-portraits">000</div>
  </div>
  <div class="stat">
    <div class="stat-label">Videos Generated</div>
    <div class="stat-value" id="stat-videos">000</div>
  </div>
</div>

<div class="screen active" id="gate">
  <div class="gate-label">access code required</div>
  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="keypad" id="keypad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <div class="key blank"></div>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="back">⌫</button>
  </div>
</div>

<div class="screen" id="floor">
  <div class="module">
    <div class="module-label"><span class="stage-num">01</span> subject capture</div>
    <div class="rig">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="rig-screen tappable" id="capture-screen">
        <video id="video" autoplay playsinline muted></video>
        <div class="ring" id="capture-ring"></div>
      </div>
    </div>
    <div class="status-led"><div class="led-dot" id="led-1"></div> camera feed</div>
  </div>

  <div class="module">
    <div class="module-label"><span class="stage-num">02</span> identity synthesis</div>
    <div class="rig">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="rig-screen" id="studio-screen">
        <canvas class="static-canvas" id="static-canvas-1"></canvas>
      </div>
    </div>
    <div class="status-led"><div class="led-dot" id="led-2"></div> synthetic portrait</div>
  </div>

  <div class="module">
    <div class="module-label"><span class="stage-num">03</span> motion generation</div>
    <div class="rig">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="rig-screen tappable" id="video-screen">
        <canvas class="static-canvas" id="static-canvas-2"></canvas>
      </div>
    </div>
    <div class="status-led"><div class="led-dot" id="led-3"></div> animated output</div>
  </div>
</div>

<div class="screen prompt-screen" id="portrait-prompt">
  <div class="prompt-title">describe the portrait you want to see</div>
  <textarea class="prompt-input" id="portrait-prompt-input"
    placeholder="e.g. renaissance oil painting, dramatic candlelight, velvet clothing..."></textarea>
  <button class="prompt-submit" id="portrait-prompt-submit">generate</button>
  <button class="prompt-skip" id="portrait-prompt-skip">use default instead</button>
</div>

<div class="screen prompt-screen" id="video-prompt">
  <div class="prompt-title">describe how it should move</div>
  <textarea class="prompt-input" id="video-prompt-input"
    placeholder="e.g. slow zoom in, hair blowing in wind, eyes glowing..."></textarea>
  <button class="prompt-submit" id="video-prompt-submit">animate</button>
  <button class="prompt-skip" id="video-prompt-skip">use default instead</button>
</div>

<div id="error-msg"><span id="error-text"></span></div>

<canvas id="hidden-canvas" style="display:none;"></canvas>

<script>
  const CODE = '2206';
  let entered = '';
  let latestPortraitUrl = null;
  let pendingCaptureDataURL = null;

  const dotsEl = document.getElementById('dots');
  const dots = Array.from(dotsEl.children);
  const keypad = document.getElementById('keypad');
  const gateScreen = document.getElementById('gate');
  const floorScreen = document.getElementById('floor');
  const portraitPromptScreen = document.getElementById('portrait-prompt');
  const videoPromptScreen = document.getElementById('video-prompt');
  const dashboard = document.getElementById('dashboard');
  const video = document.getElementById('video');
  const captureScreen = document.getElementById('capture-screen');
  const studioScreen = document.getElementById('studio-screen');
  const videoScreen = document.getElementById('video-screen');
  const staticCanvas1 = document.getElementById('static-canvas-1');
  const staticCanvas2 = document.getElementById('static-canvas-2');
  const hiddenCanvas = document.getElementById('hidden-canvas');
  const errorMsg = document.getElementById('error-msg');
  const errorText = document.getElementById('error-text');
  const led1 = document.getElementById('led-1');
  const led2 = document.getElementById('led-2');
  const led3 = document.getElementById('led-3');

  function showScreen(el){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
  }
  function flashError(msg){
    errorText.textContent = msg;
    errorMsg.classList.add('show');
  }
  errorMsg.addEventListener('click', ()=> errorMsg.classList.remove('show'));

  function updateDots(){
    dots.forEach((d,i)=> d.classList.toggle('filled', i < entered.length));
  }
  function resetGate(){ entered = ''; updateDots(); }

  keypad.addEventListener('click', e=>{
    const btn = e.target.closest('.key');
    if(!btn || btn.classList.contains('blank')) return;
    const k = btn.dataset.k;
    if(k === 'back'){ entered = entered.slice(0,-1); updateDots(); return; }
    if(entered.length >= 4) return;
    entered += k;
    updateDots();
    if(entered.length === 4){
      if(entered === CODE){
        setTimeout(()=> enterMachine(), 200);
      } else {
        dotsEl.classList.add('shake');
        dots.forEach(d=>d.classList.add('err'));
        setTimeout(()=>{
          dotsEl.classList.remove('shake');
          dots.forEach(d=>d.classList.remove('err'));
          resetGate();
        }, 420);
      }
    }
  });

  // ---- static / "no signal" noise on the two downstream rigs ----
  function drawStatic(canvas, isRunningRef){
    function frame(){
      if(!isRunningRef.on) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.clientWidth;
      const h = canvas.height = canvas.clientHeight;
      const imgData = ctx.createImageData(w,h);
      for(let i=0;i<imgData.data.length;i+=4){
        const v = Math.random()*255;
        imgData.data[i]=v; imgData.data[i+1]=v; imgData.data[i+2]=v; imgData.data[i+3]=35;
      }
      ctx.putImageData(imgData,0,0);
      requestAnimationFrame(frame);
    }
    frame();
  }
  const s1 = { on:true }, s2 = { on:true };

  // ---- dashboard: fetch and display live stats ----
  async function refreshStats(){
    try{
      const res = await fetch('/api/stats');
      const data = await res.json();
      document.getElementById('stat-participants').textContent = String(data.participants).padStart(3,'0');
      document.getElementById('stat-portraits').textContent = String(data.portraits).padStart(3,'0');
      document.getElementById('stat-videos').textContent = String(data.videos).padStart(3,'0');
    } catch(err){ /* dashboard just shows whatever it last had */ }
  }
  function logSession(stage, url){
    fetch('/api/log-session', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ stage, url })
    }).then(refreshStats).catch(()=>{});
  }

  async function enterMachine(){
    showScreen(floorScreen);
    dashboard.classList.add('active');
    drawStatic(staticCanvas1, s1);
    drawStatic(staticCanvas2, s2);
    logSession('participant');
    refreshStats();

    if(!window.isSecureContext){
      flashError('this page needs to run on https:// (or localhost) — camera won\'t work opened directly from a file.');
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      flashError('this browser has no camera API available');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
      video.srcObject = stream;
      led1.classList.add('on');
    } catch(err){
      flashError('camera permission was blocked — check your browser\'s site settings');
    }
  }

  captureScreen.addEventListener('click', ()=>{
    const w = video.videoWidth, h = video.videoHeight;
    if(!w || !h) return;
    hiddenCanvas.width = w;
    hiddenCanvas.height = h;
    hiddenCanvas.getContext('2d').drawImage(video, 0, 0, w, h);
    pendingCaptureDataURL = hiddenCanvas.toDataURL('image/jpeg', 0.92);
    document.getElementById('portrait-prompt-input').value = '';
    showScreen(portraitPromptScreen);
  });

  document.getElementById('portrait-prompt-submit').addEventListener('click', ()=>{
    const typed = document.getElementById('portrait-prompt-input').value;
    showScreen(floorScreen);
    generateStudioPortrait(pendingCaptureDataURL, typed);
  });
  document.getElementById('portrait-prompt-skip').addEventListener('click', ()=>{
    showScreen(floorScreen);
    generateStudioPortrait(pendingCaptureDataURL, '');
  });

  function runGlitch(container, led){
    led.classList.add('pulse');
    const iv = setInterval(()=>{
      const bar = document.createElement('div');
      bar.className = 'glitch-bar';
      const w = 10 + Math.random()*80;
      const h = 1 + Math.random()*3;
      const x = Math.random()*100;
      const y = Math.random()*100;
      bar.style.width = w+'%';
      bar.style.height = h+'px';
      bar.style.left = '0';
      bar.style.top = y+'%';
      bar.style.transform = `translateX(${x-50}%)`;
      bar.style.background = Math.random() > 0.5 ? '#43e0c9' : '#ff3d5a';
      bar.style.opacity = (0.3 + Math.random()*0.6).toString();
      container.appendChild(bar);
      if(container.querySelectorAll('.glitch-bar').length > 30){
        container.querySelector('.glitch-bar').remove();
      }
    }, 60);
    return () => {
      clearInterval(iv);
      led.classList.remove('pulse');
      container.querySelectorAll('.glitch-bar').forEach(b=>b.remove());
    };
  }

  // ---- stage 02: professional studio portrait ----
  async function generateStudioPortrait(dataURL, typedPrompt){
    s1.on = false;
    const stopGlitch = runGlitch(studioScreen, led2);

    try{
      const res = await fetch('/api/generate-persona', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ image: dataURL, prompt: typedPrompt })
      });
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      if(!data.image) throw new Error('no image');

      stopGlitch();
      studioScreen.querySelectorAll('img.reveal').forEach(el=>el.remove());
      const img = document.createElement('img');
      img.className = 'reveal';
      img.src = data.image;
      studioScreen.insertBefore(img, studioScreen.firstChild);
      led2.classList.add('on');
      latestPortraitUrl = data.image;
      logSession('portrait', data.image);

      // now let the visitor describe how it should move
      document.getElementById('video-prompt-input').value = '';
      showScreen(videoPromptScreen);

    } catch(err){
      stopGlitch();
      s1.on = true;
      drawStatic(staticCanvas1, s1);
      flashError('the machine is resting — try again shortly');
    }
  }

  document.getElementById('video-prompt-submit').addEventListener('click', ()=>{
    const typed = document.getElementById('video-prompt-input').value;
    showScreen(floorScreen);
    generateVideo(latestPortraitUrl, typed);
  });
  document.getElementById('video-prompt-skip').addEventListener('click', ()=>{
    showScreen(floorScreen);
    generateVideo(latestPortraitUrl, '');
  });


  // ---- stage 03: animate the studio portrait ----
  async function generateVideo(portraitUrl, typedPrompt){
    s2.on = false;
    const stopGlitch = runGlitch(videoScreen, led3);

    try{
      const res = await fetch('/api/generate-video', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ image: portraitUrl, prompt: typedPrompt })
      });
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      if(!data.video) throw new Error('no video');

      stopGlitch();
      videoScreen.querySelectorAll('video.reveal').forEach(el=>el.remove());
      const vid = document.createElement('video');
      vid.className = 'reveal';
      vid.src = data.video;
      vid.autoplay = true;
      vid.loop = true;
      vid.muted = true;
      vid.playsInline = true;
      videoScreen.insertBefore(vid, videoScreen.firstChild);
      led3.classList.add('on');
      logSession('video', data.video);

    } catch(err){
      stopGlitch();
      s2.on = true;
      drawStatic(staticCanvas2, s2);
      flashError('the video isn\'t ready yet — the portrait is still here');
    }
  }

  // tap the final (video) screen to reset for the next visitor —
  // camera on stage 01 keeps running the entire time
  videoScreen.addEventListener('click', ()=>{
    studioScreen.querySelectorAll('img.reveal').forEach(el=>el.remove());
    videoScreen.querySelectorAll('video.reveal').forEach(el=>el.remove());
    led2.classList.remove('on');
    led3.classList.remove('on');
    s1.on = true; drawStatic(staticCanvas1, s1);
    s2.on = true; drawStatic(staticCanvas2, s2);
  });
</script>

</body>
</html>
