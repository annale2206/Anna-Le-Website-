<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>manifesto fiction — the scripts</title>
<style>
  html, body{
    margin:0; padding:0;
    background:#fff;
    color:#000;
    font-family:Georgia, serif;
  }

  h1{
    font-size:34px;
    padding:40px 30px 0;
    margin:0;
  }

  .gallery{
    max-width:1100px;
    margin:50px auto 80px;
    padding:0 20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }

  .cell{
    position:relative;
    height:380px;
    background:#fff;
    overflow:hidden;
    cursor:none;
  }
  .cell img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .cell .base{ z-index:1; }
  .cell .reveal{
    z-index:2;
    -webkit-mask-image: radial-gradient(circle 220px at var(--mx,-999px) var(--my,-999px), black 55%, transparent 100%);
            mask-image: radial-gradient(circle 220px at var(--mx,-999px) var(--my,-999px), black 55%, transparent 100%);
  }

  .caption{
    text-align:center;
    font-size:15px;
    letter-spacing:.03em;
    margin-top:8px;
    color:#444;
    text-decoration:line-through;
    text-decoration-color:#999;
  }

  #gallery-dot{
    position:fixed; top:0; left:0;
    width:10px; height:10px;
    border-radius:50%;
    background:#fff;
    border:2px solid #000;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999;
    display:none;
  }
</style>
</head>
<body>

<a href="manifesto-fiction.html" style="text-decoration:none; color:inherit;">
  <h1 style="cursor:pointer; display:inline;">The Glitch Scripts</h1>
</a>
<span style="font-family:Georgia, serif; font-size:16px; color:#888; margin-left:10px;">(paper)</span>

<div class="gallery">
  <div class="grid">
    <div>
      <div class="cell">
        <img class="base" src="Lotus Blossom top.png" alt="">
        <img class="reveal" src="Lotus Blossom bottom.png" alt="">
      </div>
      <div class="caption">Lotus Blossom</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="Dragon Lady top.png" alt="">
        <img class="reveal" src="Dragon Lady bottom.png" alt="">
      </div>
      <div class="caption">Dragon Lady</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="The Objectification top.png" alt="">
        <img class="reveal" src="The Objectifcation bottom.png" alt="">
      </div>
      <div class="caption">The Objectification</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="School Girl top.png" alt="">
        <img class="reveal" src="School Girl bottom.png" alt="">
      </div>
      <div class="caption">School Girl</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="Machine Like top.png" alt="">
        <img class="reveal" src="Machine Like bottom.png" alt="">
      </div>
      <div class="caption">Machine Like</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="Model Minority top.png" alt="">
        <img class="reveal" src="Model Minority bottom.png" alt="">
      </div>
      <div class="caption">Model Minority</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="Exotic Other top.png" alt="">
        <img class="reveal" src="Exotic Other bottom .png" alt="">
      </div>
      <div class="caption">Exotic Other</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="Kung fu top.png" alt="">
        <img class="reveal" src="Kung fu bottom.png" alt="">
      </div>
      <div class="caption">Kung Fu</div>
    </div>
    <div>
      <div class="cell">
        <img class="base" src="Tiger Mom top.png" alt="">
        <img class="reveal" src="Tiger Mom bottom.png" alt="">
      </div>
      <div class="caption">Tiger Mom</div>
    </div>
  </div>
</div>

<div id="gallery-dot"></div>

<script>
  const cells = document.querySelectorAll('.cell');
  const dot = document.getElementById('gallery-dot');

  cells.forEach(cell => {
    cell.addEventListener('mousemove', e => {
      const rect = cell.getBoundingClientRect();
      cell.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      cell.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });
    cell.addEventListener('mouseleave', () => {
      cell.style.setProperty('--mx', '-999px');
      cell.style.setProperty('--my', '-999px');
      dot.style.display = 'none';
    });
    cell.addEventListener('mouseenter', () => { dot.style.display = 'block'; });
  });

  document.addEventListener('mousemove', e => {
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
  });
</script>

</body>
</html>
